.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{padding:21px;border:1px solid #dee9ec;border-top:5px solid var(--c);border-radius:14px;background:#fff;min-height:130px;text-align:right;display:flex;flex-direction:column;gap:8px;justify-content:center}.choice:hover{background:#f8fcfd}.choice strong{font:700 19px/1.45 "El Messiri";color:#26556a}.choice small{font:600 12px/1.65 "El Messiri";color:var(--sub)}.choice .number{font:700 40px "El Messiri";color:var(--c)}

.paper{padding:clamp(20px,3vw,35px);border:1px solid #dfe9ed;border-radius:15px;margin:0 0 24px;background:white}.paper h3{font:700 clamp(18px,1.9vw,24px) "El Messiri";margin:0 0 16px;color:#225263}.paper h3 em{display:inline-grid;width:33px;height:33px;place-items:center;border-radius:10px;background:var(--c);color:white;font:700 14px "El Messiri";font-style:normal;margin-left:9px}.question{border-right:5px solid var(--c);background:#f8fcfd;border-radius:9px;padding:21px;font:600 clamp(28px,3vw,40px)/1.27 "Markazi Text";white-space:pre-line}.values{padding-right:27px;margin:10px 0;font:400 clamp(23px,2.4vw,34px)/1.3 "Lateef"}.values li{margin-bottom:7px}.red{color:var(--red);font-weight:700}.redlabel{font:700 13px "El Messiri";color:var(--red);margin:22px 0 0}.rule{height:1px;background:#e9eff1;margin:23px 0}.para{font:400 clamp(24px,2.5vw,35px)/1.32 "Lateef";margin:0}.why{background:#f6fafb;border-right:3px solid #a2ccd6;padding:14px 17px;border-radius:9px;font:400 clamp(22px,2.2vw,30px)/1.3 "Lateef";margin:14px 0}.why b{display:block;color:#1f667e;font:700 12px "El Messiri";margin-bottom:5px}.eq{direction:ltr;unicode-bidi:isolate;text-align:center;background:#f8fafc;border:1px solid #dfeaed;border-radius:11px;padding:16px 11px;font:700 clamp(18px,2.2vw,28px)/1.5 Georgia,"Cambria Math",serif;overflow-wrap:anywhere;margin:16px 0}

<script>
const DATA=[{"n":0,"color":"#2858b8","page":49,"id":"2","title":"تأثير الاحتكاك في سرعة القمر الاصطناعي","question":"عندما يتعرض القمر الاصطناعي لقوى احتكاك في مداره، فإنه يتخذ مدارًا حلزونيًا يقترب فيه من الأرض. كيف يؤثر ذلك في سرعته الخطية (المماسية)؟ وضّح إجابتك.","given":["القمر يتعرض للاحتكاك ويفقد جزءًا من طاقته الميكانيكية.","مساره يقترب تدريجيًا من الأرض."],"added":[],"wanted":"تفسير أثر الاقتراب من الأرض في السرعة المماسية.","why":"","principle":"","formulas":[{"formula":"F_g = GMm / r²","guide":"هذه القوة تجذب القمر إلى داخل المدار، وكلما اقترب زادت قوة جذب الأرض له."},{"formula":"F_c = mv² / r","guide":"الجسم الذي يتحرك في دائرة يحتاج قوة تشدّه نحو المركز؛ في هذه المسألة الجاذبية نفسها تؤدي هذا الدور."},{"formula":"F_g = F_c  ⟹  v = √(GM / r)","guide":"عندما نساوي القوتين ونبسط، نجد أن السرعة الدائرية تصبح أكبر إذا صغر r."}],"steps":[{"title":"نبدأ من حركة القمر الدائرية","body":"تتجه قوة الجاذبية نحو مركز الأرض وتوفر القوة المركزية.","guide":"حتى لو بدت حركة القمر ثابتة من بعيد، فإن اتجاه سرعته يتغير دائمًا بسبب الجاذبية."},{"title":"ننظر إلى أثر الاحتكاك","body":"يفقد القمر طاقة ميكانيكية، فيهبط تدريجيًا نحو الأرض.","guide":"الاحتكاك يسحب طاقة من الحركة، فتقل الطاقة الميكانيكية ويبدأ المدار بالهبوط."},{"title":"نقارن بين مدارين دائريين","body":"في المدار الأدنى يصغر r، ولذلك تزداد قيمة v = √(GM/r) عند ثبات G وM.","guide":"انتبهي: النتيجة تقارن سرعتين لمدارين دائريين؛ وليست وصفًا لكل ثانية من مسار الهبوط الحلزوني."}],"result":"في المدار الدائري الأدنى تكون السرعة المدارية أكبر.","meaning":"فقد الطاقة الكلية لا يعني بالضرورة أن طاقة الحركة أصغر؛ إذ تتغير طاقة وضع الجاذبية أيضًا.","warning":"العلاقة v = √(GM/r) تصف المدار الدائري. أثناء الهبوط الحلزوني المصحوب بمقاومة لا تكون الحركة دائرة مثالية ولا يلزم أن تتزايد السرعة في كل لحظة.","hook":"تخيّلي قمرًا كان يدور بعيدًا ثم صار أقرب إلى الأرض. هل نقارن سرعة قمر في مدارين مختلفين أم لحظة تأثره بالاحتكاك؟ الفرق مهم."},{"n":1,"color":"#813ab1","page":49,"id":"3 (أ)","title":"السرعة المماسية لقمر على ارتفاع 5900 km","question":"افترض أن قمرًا اصطناعيًا يدور على ارتفاع 5900 km فوق سطح الأرض. (أ) احسب سرعته المماسية.","given":["الارتفاع عن السطح: h = 5900 km"],"added":["نصف قطر الأرض R = 6.4 × 10⁶ m","كتلة الأرض M = 6.0 × 10²⁴ kg","ثابت الجذب G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"السرعة المماسية المدارية v.","why":"","principle":"","formulas":[{"formula":"GMm / r² = mv² / r","guide":"نكتب قوة الجذب التي تبقي القمر قريبًا من الأرض."},{"formula":"GM / r = v²","guide":"القمر لا يتحرك مستقيمًا؛ يحتاج قوة تغير اتجاه سرعته باستمرار."},{"formula":"v = √(GM / r)","guide":"توجد كتلة القمر m في الطرفين؛ عندما نختصرها تظهر السرعة التي نريد حسابها."}],"steps":[{"title":"تحويل الارتفاع إلى المتر","body":"h = 5900 × 1000 = 5.9 × 10⁶ m","guide":"الكيلو متر أكبر من المتر ألف مرة؛ ولذلك نضرب في 1000."},{"title":"إيجاد نصف قطر المدار","body":"r = R + h = 6.4 × 10⁶ + 5.9 × 10⁶ = 1.23 × 10⁷ m","guide":"الرقم 5900 km ارتفاع عن السطح، بينما القانون يطلب المسافة من مركز الأرض."},{"title":"التعويض بالقيم المناسبة","body":"v = √[(6.67 × 10⁻¹¹ × 6.0 × 10²⁴) / (1.23 × 10⁷)]","guide":"نضع كتلة الأرض ونصف قطر المدار داخل القانون بعد توحيد الوحدات."},{"title":"حساب الناتج","body":"v ≈ 5704 m/s = 5.70 km/s","guide":"نقسم داخل الجذر أولًا ثم نحسب الجذر التربيعي؛ وعند التحويل إلى km/s نقسم على 1000."}],"result":"v ≈ 5.70 km/s","meaning":"يقطع القمر نحو 5.70 كيلومتر كل ثانية أثناء حركته حول الأرض في المدار المفترض.","warning":"لا تعوّضي عن r بارتفاع 5900 km؛ نصف قطر المدار يساوي R + h، واحرصي على استخدام وحدة المتر.","hook":"تخيّلي أنك تقيسين مكان القمر من وسط الأرض لا من سطحها. لهذا نجمع نصف قطر الأرض مع الارتفاع."},{"n":2,"color":"#813ab1","page":49,"id":"3 (ب)","title":"الزمن الدوري للقمر الاصطناعي","question":"افترض أن قمرًا اصطناعيًا يدور على ارتفاع 5900 km فوق سطح الأرض. (ب) احسب الزمن الدوري لدورانه.","given":["h = 5900 km","من الجزء (أ): r = 1.23 × 10⁷ m، والسرعة ≈ 5704 m/s"],"added":[],"wanted":"الزمن الدوري T بالدقائق أو الساعات.","why":"","principle":"","formulas":[{"formula":"t = d / v","guide":"هذا هو القانون البسيط الذي نستخدمه حتى في المشي والسيارات: الزمن يساوي المسافة على السرعة."},{"formula":"d = 2πr","guide":"بما أن الرحلة دورة دائرية كاملة فالمسافة ليست الارتفاع، بل محيط الدائرة."},{"formula":"T = 2πr / v","guide":"نعوّض عن المسافة بالمحيط ونستخدم سرعة القمر التي حسبناها في الجزء السابق."}],"steps":[{"title":"نحدد المسافة في دورة كاملة","body":"d = 2π × 1.23 × 10⁷ m","guide":"هذه المسافة من مركز الأرض للقمر هي نصف قطر المسار كله."},{"title":"نعوض بالسرعة المحسوبة","body":"T = (2π × 1.23 × 10⁷) / 5704","guide":"نستخدم السرعة المحسوبة سابقًا، لا نعيد استخدام الارتفاع على أنه سرعة."},{"title":"نحسب الزمن بالثواني","body":"T ≈ 13,549 s","guide":"بعد أن نكتب محيط الدائرة نقسم على السرعة بوحدة m/s؛ الناتج سيكون بالثواني."},{"title":"نحول إلى ساعات","body":"T = 13,549 / 3600 ≈ 3.76 h","guide":"كل ساعة 3600 ثانية؛ لذلك نحول الناتج إلى ساعات بالقسمة."}],"result":"T ≈ 13,549 s ≈ 3.76 ساعة","meaning":"زمن الدورة الواحدة يقارب 3 ساعات و46 دقيقة.","warning":"السرعة هنا سرعة القمر المدارية. لا تستخدمي الارتفاع بوصفه مسافة دورة كاملة.","hook":"تخيّلي القمر عند نقطة البداية، ثم انتظري حتى يعود إلى النقطة نفسها؛ هذا هو الزمن الدوري. نحتاج طول الرحلة كلها."},{"n":3,"color":"#077e66","page":49,"id":"4","title":"نصف قطر المدار المتزامن مع الأرض","question":"إذا كان الزمن الدوري لدوران الأرض حول نفسها 86,164 ثانية، احسب نصف قطر مدار القمر الاصطناعي المتزامن مع الأرض.","given":["الزمن الدوري T = 86,164 s"],"added":["كتلة الأرض M = 6.0 × 10²⁴ kg","G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"نصف قطر المدار r من مركز الأرض.","why":"","principle":"","formulas":[{"formula":"GMm / r² = mv² / r","guide":"هذه الخطوة الأولى: نعرف كيف تتوازن الحركة الدائرية مع جذب الأرض."},{"formula":"v = 2πr / T","guide":"نريد استبدال السرعة بعلاقة تحتوي على الزمن المعروف في السؤال."},{"formula":"(2πr / T)² = GM / r","guide":"وضعنا 2πr/T مكان v؛ لذلك صار لدينا r وT بدل v."},{"formula":"r³ = GMT² / (4π²)","guide":"نرتب الحدود ونأخذ الجذر التكعيبي؛ لأن نصف القطر ظهر مرفوعًا للقوة 3."},{"formula":"r = ∛[GMT² / (4π²)]","guide":"هذه الصيغة النهائية تستخدم الزمن وكتلة الأرض لإيجاد نصف القطر."}],"steps":[{"title":"نثبت الزمن الدوري","body":"T = 86,164 s (بالثواني أصلًا).","guide":"القيمة معطاة بالثواني، إذن لا حاجة لأي تحويل زمني."},{"title":"نستخدم العلاقة المشتقة","body":"r = ∛[(6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 86164²) / (4π²)]","guide":"كل كمية دخلت في القانون بوحداتها الدولية، وT تربيع يعني ضرب الزمن في نفسه."},{"title":"نحسب الجذر التكعيبي","body":"r ≈ 4.222 × 10⁷ m","guide":"تذكّري أننا نأخذ الجذر التكعيبي وليس الجذر التربيعي."},{"title":"نحول إلى كيلومتر","body":"r ≈ 42,220 km","guide":"السؤال طلب نصف قطر المدار من المركز، فلا نطرح نصف قطر الأرض."}],"result":"r ≈ 4.22 × 10⁷ m ≈ 42,200 km","meaning":"الناتج مسافة مركز الأرض إلى القمر المتزامن، وليس ارتفاع القمر عن سطح الأرض.","warning":"السؤال عن نصف قطر المدار r، لذلك لا تطرحي نصف قطر الأرض. نطرحه فقط إذا طُلب الارتفاع h.","hook":"ما معنى متزامن؟ يعني أن القمر والأرض يكملان دورتيهما في زمن متطابق. السؤال يعطينا الزمن ويطلب بُعد القمر."},{"n":4,"color":"#b17a08","page":49,"id":"5","title":"استنتاج كتلة الشمس من مدار الأرض","question":"احسب كتلة الشمس إذا علمت أن نصف قطر مدار الأرض حول الشمس 1.5 × 10⁸ km، وأن الأرض تكمل مدارها في 365 يومًا، وأن كتلة الأرض تبلغ 6 × 10²⁴ kg.","given":["r = 1.5 × 10⁸ km","T = 365 يومًا","كتلة الأرض m = 6 × 10²⁴ kg"],"added":["ثابت الجذب G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"كتلة الشمس M☉ بالكيلوغرام.","why":"","principle":"","formulas":[{"formula":"GM☉m / r² = mv² / r","guide":"الشمس تجذب الأرض؛ هذه الجاذبية هي التي توفر القوة المركزية لدوران الأرض."},{"formula":"v = 2πr / T","guide":"الأرض تقطع دائرة كاملة في 365 يومًا؛ لذا نستخدم محيط الدائرة مقسومًا على الزمن."},{"formula":"M☉ = 4π²r³ / (GT²)","guide":"بعد التعويض تختفي كتلة الأرض من الطرفين ونستطيع إيجاد كتلة الشمس."}],"steps":[{"title":"تحويل البعد إلى أمتار","body":"r = 1.5 × 10⁸ × 1000 = 1.5 × 10¹¹ m","guide":"لأن قانون الجاذبية يستخدم المتر، نضرب الكيلومترات في 1000."},{"title":"تحويل الزمن إلى ثوانٍ","body":"T = 365 × 24 × 3600 = 3.1536 × 10⁷ s","guide":"كل يوم 24 ساعة، وكل ساعة 3600 ثانية؛ نضرب معًا للوصول إلى الثواني."},{"title":"كتابة التعويض","body":"M☉ = [4π² × (1.5 × 10¹¹)³] / [6.67 × 10⁻¹¹ × (3.1536 × 10⁷)²]","guide":"ننتبه إلى أن r مكعب وT مربع؛ ترتيب الأقواس مهم."},{"title":"الحساب النهائي","body":"M☉ ≈ 2.009 × 10³⁰ kg","guide":"كتلة الشمس هائلة، ولذلك يظهر الناتج بالصيغة العلمية مع الأس 30."}],"result":"كتلة الشمس ≈ 2.01 × 10³⁰ kg","meaning":"يمكن قياس كتلة جسم مركزي من حركة جسم يدور حوله مع معرفة زمن الدورة ونصف قطر المدار.","warning":"كتلة الأرض المعطاة تختصر بين طرفي معادلة القوى؛ لا تضربي بها مرة ثانية في القانون النهائي.","hook":"هل يمكن معرفة كتلة الشمس دون وزنها على ميزان؟ نعم! ننظر كيف تجذب الأرض فتجعلها تدور في مدار معلوم."},{"n":5,"color":"#a33396","page":49,"id":"6 (أ)","title":"بعد كوكب زمن دورته 8 سنوات","question":"(أ) احسب المسافة بين كوكب والشمس إذا كان زمنه الدوري المداري 8 سنوات.","given":["T = 8 سنوات"],"added":["كتلة الشمس من السؤال السابق M☉ ≈ 2.0 × 10³⁰ kg","G = 6.67 × 10⁻¹¹ N·m²/kg²","نفترض 365 يومًا في السنة"],"wanted":"المسافة r من مركز الشمس إلى الكوكب.","why":"","principle":"","formulas":[{"formula":"GM☉m / r² = mv² / r","guide":"مثل دوران القمر حول الأرض، لكن الجسم المركزي هذه المرة هو الشمس."},{"formula":"v = 2πr / T","guide":"السؤال أعطانا زمن الرحلة؛ لذلك نستبدل السرعة بمحيط الدائرة على الزمن."},{"formula":"r³ = GM☉T² / (4π²)","guide":"بعد ترتيب العلاقة نحصل على r³، ونريد r وحده."},{"formula":"r = ∛[GM☉T² / (4π²)]","guide":"نأخذ الجذر التكعيبي ونستخدم كتلة الشمس التي توصلنا إليها في السؤال 5."}],"steps":[{"title":"تحويل السنوات إلى ثوانٍ","body":"T = 8 × 365 × 24 × 3600 = 2.52288 × 10⁸ s","guide":"لا يجوز التعويض بثماني سنوات مباشرة في قانون يستخدم المتر والثانية."},{"title":"التعويض بالقيم الدولية","body":"r = ∛[(6.67 × 10⁻¹¹ × 2.0 × 10³⁰ × (2.52288 × 10⁸)²) / (4π²)]","guide":"لاحظي أن T² يعني تربيع كل القيمة المحولة إلى ثوانٍ."},{"title":"حساب المسافة بالأمتار","body":"r ≈ 5.991 × 10¹¹ m","guide":"الناتج هنا بالمتر لأن جميع المدخلات بوحدات النظام الدولي."},{"title":"التحويل إلى كيلومتر","body":"r ≈ 5.99 × 10⁸ km","guide":"نقسم على 1000 عندما نريد الإجابة بالكيلومتر."}],"result":"r ≈ 6.0 × 10⁸ km","meaning":"الكوكب أبعد عن الشمس من الأرض، ولذلك زمن دورته أكبر من سنة أرضية.","warning":"القيمة 8 سنوات يجب تحويلها إلى ثوانٍ قبل التعويض مع ثابت الجذب بوحداته الدولية.","hook":"نعرف أن الكوكب يستغرق 8 سنوات ليعود إلى النقطة نفسها، ونريد المسافة بينه وبين الشمس."},{"n":6,"color":"#a33396","page":49,"id":"6 (ب)","title":"بعد كوكب زمن دورته 45.6 سنة","question":"(ب) احسب المسافة بين أحد الكواكب والشمس إذا كان زمنه الدوري المداري 45.6 سنة.","given":["T = 45.6 سنة"],"added":["M☉ ≈ 2.0 × 10³⁰ kg (من المسألة 5)","G = 6.67 × 10⁻¹¹ N·m²/kg²","نفترض 365 يومًا في السنة"],"wanted":"المسافة r من الشمس إلى الكوكب.","why":"","principle":"","formulas":[{"formula":"GM☉m / r² = mv² / r","guide":"نبدأ بالقوة التي تحافظ على الكوكب في مداره حول الشمس."},{"formula":"v = 2πr / T","guide":"نستبدل السرعة بتعبير يعتمد على زمن الدورة ومحيط المدار."},{"formula":"r = ∛[GM☉T² / (4π²)]","guide":"هذه العلاقة تسمح بحساب r بعد تحويل الزمن إلى الثواني."}],"steps":[{"title":"تحويل الزمن","body":"T = 45.6 × 365 × 24 × 3600 = 1.4380416 × 10⁹ s","guide":"45.6 سنة عدد طويل؛ نضرب في عدد ثواني السنة للحصول على T الصحيح."},{"title":"التعويض بالقيم","body":"r = ∛[(6.67 × 10⁻¹¹ × 2.0 × 10³⁰ × (1.4380416 × 10⁹)²) / (4π²)]","guide":"لا نغيّر كتلة الشمس أو G لأن الجسم المركزي لم يتغيّر."},{"title":"الناتج بالمتر","body":"r ≈ 1.912 × 10¹² m","guide":"الجذر التكعيبي مطلوب لأننا استخرجنا r³ من تساوي القوتين."},{"title":"بالكيلومتر","body":"r ≈ 1.91 × 10⁹ km","guide":"تحويل المتر إلى كيلومتر لا يغيّر المسافة نفسها؛ يغيّر فقط طريقة كتابة الوحدة."}],"result":"r ≈ 1.91 × 10⁹ km","meaning":"كلما كبر نصف قطر المدار حول الشمس، ازداد الزمن اللازم لإتمام دورة.","warning":"اختلاف التقريب بين 1.91 و1.92 مليار km مقبول بحسب تقريب ثابت كتلة الشمس والنتائج الوسيطة.","hook":"لدينا الكوكب نفسه من نوع المسألة السابقة، لكن دورته أطول بكثير: 45.6 سنة. ماذا نتوقع؟ مدار أكبر."},{"n":7,"color":"#56801c","page":49,"id":"7","title":"زمن كوكب يبعد 14 ضعف بعد الأرض","question":"تبعد الأرض 1.5 × 10⁸ km عن الشمس. فإذا اكتُشف كوكب يبعد عن الشمس 14 مرة من بعد الأرض عنها، فكم سيكون الزمن الدوري المداري له؟ اعتبر الزمن الدوري المداري للأرض 365 يومًا.","given":["rₚ / rₑ = 14","Tₑ = 365 يومًا","rₑ = 1.5 × 10⁸ km"],"added":[],"wanted":"الزمن الدوري Tₚ للكوكب الجديد.","why":"","principle":"","formulas":[{"formula":"T = 2πr / v","guide":"الزمن الدوري هو طول الطريق الدائري مقسومًا على السرعة."},{"formula":"v = √(GM☉ / r)","guide":"تخبرنا علاقة نيوتن أن الكوكب الأبعد يتحرك بسرعة دائرية أقل حول الشمس نفسها."},{"formula":"vₚ / vₑ = √(rₑ / rₚ)","guide":"لأن الكوكبين يدوران حول الشمس نفسها، تختصر كتلة الشمس وثابت الجذب عند المقارنة."},{"formula":"Tₚ / Tₑ = (rₚ / rₑ) × (vₑ / vₚ)","guide":"نقارن الزمنين بدلاً من حساب كتلة الشمس والمسافات والسرعات كل مرة."}],"steps":[{"title":"مقارنة سرعتي المدارين","body":"بما أن rₚ/rₑ = 14، فإن vₑ/vₚ = √14.","guide":"عندما تتضاعف المسافة 14 مرة، تقل السرعة بنسبة الجذر التربيعي لـ 14."},{"title":"مقارنة الزمنين","body":"Tₚ/Tₑ = 14 × √14.","guide":"الزمن يزيد بسبب محيط المدار الأكبر وبسبب السرعة الأصغر."},{"title":"التعويض عن زمن الأرض","body":"Tₚ = 365 × 14 × √14 ≈ 19,119.9 يومًا","guide":"نضرب زمن الأرض 365 يومًا في عامل الزيادة الكلي."},{"title":"التحويل إلى سنوات","body":"Tₚ ≈ 19,119.9 / 365 ≈ 52.38 سنة","guide":"نقسم الأيام على 365 حتى تصبح الإجابة بعدد السنوات."}],"result":"Tₚ ≈ 52.4 سنة","meaning":"زيادة المسافة تجعل طول المدار أكبر وسرعة الحركة أبطأ، لذلك يزداد زمن الدورة كثيرًا.","warning":"لا تضربي 365 × 14 فقط؛ يلزم أيضًا أخذ انخفاض السرعة المدارية في الحسبان.","hook":"فكري في الرحلة: كوكب أبعد 14 مرة، إذن الطريق حول الشمس أطول، وسرعته المدارية أقل. العاملان يزيدان الزمن."},{"n":8,"color":"#4549a6","page":49,"id":"8 (أ)","title":"لو أصبح اليوم الأرضي 12 ساعة","question":"تدور الأقمار الاصطناعية الثابتة بالنسبة إلى الأرض على ارتفاع 36,000 km عن سطح الأرض (أي على بعد نحو 42,300 km من مركز الأرض). (أ) إذا كان طول يوم الأرض 12 ساعة فقط بدلًا من 24 ساعة، فهل يكون ارتفاع القمر الاصطناعي الثابت أعلى من 36,000 km أم أدنى منه أم يساويه؟","given":["الارتفاع الحالي ≈ 36,000 km","T الحالي ≈ 24 h","T الجديد = 12 h"],"added":["نفترض عدم تغير كتلة الأرض ونصف قطرها."],"wanted":"هل المدار الجديد أعلى أم أدنى أم مساوٍ؟","why":"","principle":"","formulas":[{"formula":"v = 2πr / T","guide":"السرعة في دورة كاملة تعتمد على محيط المدار والزمن."},{"formula":"v = √(GM / r)","guide":"تحدد جاذبية الأرض السرعة اللازمة للمدار الدائري."},{"formula":"r = ∛[GMT² / (4π²)]","guide":"من هذين القانونين نرى أن الزمن الأقصر يحتاج نصف قطر مدار أصغر."}],"steps":[{"title":"نحدد الزمن المطلوب","body":"T الجديد = T القديم / 2.","guide":"نصف 24 ساعة هو 12 ساعة، لذلك زمن الدورة المطلوب أصبح أقصر."},{"title":"نقرأ العلاقة الفيزيائية","body":"عند ثبات M وG، تقليل T يؤدي إلى تقليل r.","guide":"لا نغيّر كتلة الأرض في هذا الافتراض؛ تقليل T يعني تقليل r."},{"title":"نحوّل ذلك إلى ارتفاع","body":"لأن h = r − R ومع ثبات R، يقل الارتفاع أيضًا.","guide":"إذا اقترب مدار القمر من مركز الأرض، فإن ارتفاعه عن سطحها يقل."}],"result":"الارتفاع الجديد أدنى من 36,000 km.","meaning":"يتحرك القمر في المدار الأقرب بسرعة أكبر ويكمل دورته بزمن أقصر.","warning":"لا نخلط بين سرعة الدوران وزيادة الارتفاع: الأقمار القريبة في مدارات دائرية تتحرك أسرع.","hook":"القمر الثابت يبدو ساكنًا فوق المكان نفسه لأن زمن دورته مثل زمن يوم الأرض. ماذا لو صار اليوم نصف طوله؟"},{"n":9,"color":"#4549a6","page":49,"id":"8 (ب)","title":"لو أصبحت كتلة الأرض مثلي كتلتها","question":"(ب) لنفترض أن الأرض قد تكونت منذ ما يقرب من خمسة مليارات سنة بكتلة تبلغ مثلي كتلتها الحالية، فهل سيكون ارتفاع القمر الاصطناعي الثابت بالنسبة إلى الأرض أعلى من 36,000 km أم أدنى منه أم يساويه؟","given":["M الجديدة = 2M القديمة","ارتفاع المدار الحالي ≈ 36,000 km"],"added":["نفترض ثبات طول اليوم الأرضي.","نفترض ثبات نصف قطر الأرض."],"wanted":"هل ارتفاع المدار المتزامن يزيد أم ينقص أم يبقى؟","why":"","principle":"","formulas":[{"formula":"r = ∛[GMT² / (4π²)]","guide":"نصف قطر المدار يتحدد بالجاذبية والزمن الدوري؛ والآن الزمن ثابت والكتلة تغيّرت."},{"formula":"r الجديدة / r القديمة = ∛(M الجديدة / M القديمة)","guide":"نقارن قبل وبعد بدل إعادة الحساب بكل الأرقام."}],"steps":[{"title":"نكتب الكتلة الجديدة","body":"M الجديدة = 2M القديمة.","guide":"هذا هو الفرق الوحيد المقصود في المسألة: تصبح كتلة الأرض ضعف قيمتها."},{"title":"نقسم علاقتي نصف القطر","body":"عند ثبات G وT: r الجديدة / r القديمة = ∛2.","guide":"عند القسمة تختصر الثوابت والزمن ونبقي نسبة الكتلتين."},{"title":"نحسب النسبة","body":"∛2 ≈ 1.26، أي إن نصف قطر المدار أكبر بنحو 26%.","guide":"الجذر التكعيبي لـ2 نحو 1.26، أي إن المدار الجديد أبعد."},{"title":"نستنتج الارتفاع","body":"مع ثبات نصف قطر الأرض R يزداد h = r − R.","guide":"كلما كبر نصف قطر المدار مع ثبات حجم الأرض زاد ارتفاع القمر."}],"result":"الارتفاع الجديد أعلى من 36,000 km.","meaning":"عند ثبات الزمن الدوري، تتطلب الكتلة المركزية الأكبر مدارًا أبعد.","warning":"النتيجة تعتمد على افتراضي ثبات يوم الأرض ونصف قطرها. لو تغير طول اليوم أيضًا فقد يختلف الحكم.","hook":"تخيّلي أرضًا أثقل بمرتين. لكي يكون القمر ثابتًا بالنسبة لها وبنفس طول اليوم، في أي مسافة ينبغي أن يدور؟"},{"n":10,"color":"#b95c1b","page":56,"id":"34 (أ)","title":"GPS: إيجاد المسافة من زمن الإشارة","question":"يرسل القمر الاصطناعي العالمي لتحديد المواقع (GPS) إشارة لاسلكية يستقبلها جهاز استقبال على الأرض بعد 67 ms من إرسالها. (أ) احسب ارتفاع القمر الاصطناعي عن سطح الأرض.","given":["زمن انتقال الإشارة t = 67 ms"],"added":["سرعة الضوء c = 3.0 × 10⁸ m/s","نفترض أن القمر يقع فوق جهاز الاستقبال مباشرة.","نهمل التأخيرات الإضافية لمسار الإشارة."],"wanted":"ارتفاع القمر h في النموذج المفترض.","why":"","principle":"","formulas":[{"formula":"d = v × t","guide":"أي مسافة تقطعها حركة منتظمة = السرعة × الزمن."},{"formula":"في الإشارة اللاسلكية: v = c","guide":"الإشارة موجة كهرومغناطيسية؛ سرعتها تقارب سرعة الضوء c."},{"formula":"d = c × t","guide":"نعوّض سرعة الضوء بدل السرعة المعتادة، ثم نحسب المسافة."}],"steps":[{"title":"نحوّل الميلي ثانية إلى ثانية","body":"t = 67 × 10⁻³ = 0.067 s","guide":"الميلي ثانية جزء من الألف من الثانية. لذلك 67 ms = 0.067 s."},{"title":"نطبق قانون المسافة","body":"d = (3.0 × 10⁸) × 0.067 = 2.01 × 10⁷ m","guide":"السرعة متر لكل ثانية، والوقت بالثواني؛ إذن الوحدة النهائية متر."},{"title":"نحول إلى كيلومتر","body":"d = 2.01 × 10⁷ / 1000 = 20,100 km","guide":"نقسم على 1000 حتى نعبر عن المسافة بالكيلومترات."},{"title":"نفسر في ضوء الافتراض","body":"إذا كان القمر مباشرة فوق المستقبل فالمسافة المستقيمة للإشارة مساوية للارتفاع h.","guide":"تنبيه: اعتبرنا هذه المسافة ارتفاعًا لأننا افترضنا القمر فوق الجهاز مباشرة."}],"result":"d = 20,100 km؛ وبافتراض المسار الرأسي h = 20,100 km.","meaning":"هذه مسافة انتقال الإشارة، وليس مقدار السرعة المدارية للقمر.","warning":"زمن الإشارة وحده لا يحدد ارتفاع القمر الهندسي إذا كانت الإشارة تسير بزاوية. لذلك تظهر فرضية المسار الرأسي صراحة.","hook":"هنا يوجد نوعان من الحركة: حركة القمر في المدار، وحركة الإشارة من القمر إلى الجهاز. نحتاج مسافة الإشارة أولًا."},{"n":11,"color":"#b95c1b","page":56,"id":"34 (ب)","title":"GPS: شدة مجال الجاذبية عند الارتفاع","question":"(ب) احسب شدة مجال الجاذبية الأرضية عند ذلك الارتفاع، علمًا بأن كتلة الأرض 6.0 × 10²⁴ kg ونصف قطر الأرض 6.4 × 10⁶ m.","given":["Mₑ = 6.0 × 10²⁴ kg","Rₑ = 6.4 × 10⁶ m","من (أ): h = 2.01 × 10⁷ m (وفق الافتراض)"],"added":["G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"شدة مجال الجاذبية g عند القمر.","why":"","principle":"","formulas":[{"formula":"g = F_g / m","guide":"المجال هو قوة الجاذبية التي تؤثر في كل كيلوغرام واحد."},{"formula":"F_g = GMₑm / r²","guide":"نستبدل القوة بقانون الجذب العام."},{"formula":"g = GMₑ / r²","guide":"تختصر كتلة القمر الصغيرة، فنرى أن المجال يعتمد على كتلة الأرض وبعد القمر فقط."}],"steps":[{"title":"نحسب نصف قطر المدار","body":"r = Rₑ + h = 6.4 × 10⁶ + 2.01 × 10⁷ = 2.65 × 10⁷ m","guide":"هذا هو بُعد القمر عن مركز الأرض، وليس ارتفاعه عن السطح."},{"title":"نكتب التعويض الصحيح","body":"g = (6.67 × 10⁻¹¹ × 6.0 × 10²⁴) / (2.65 × 10⁷)²","guide":"في المقام r²؛ أي إننا نضرب نصف قطر المدار في نفسه."},{"title":"نحسب شدة المجال","body":"g ≈ 0.5699 N/kg ≈ 0.570 N/kg","guide":"القيمة صغيرة مقارنة بجاذبية السطح لكنها ليست صفرًا."}],"result":"g ≈ 0.570 N/kg","meaning":"مجال الجاذبية يقل مع زيادة البعد عن مركز الأرض، لكنه لا يختفي عند هذا الارتفاع.","warning":"نتيجة (ب) مشروطة بارتفاع الجزء (أ). ولا نضع الارتفاع h مباشرة بدل نصف قطر المدار r في المقام.","hook":"الجاذبية تقل كلما ابتعدنا عن مركز الأرض. نحتاج أولًا المسافة من المركز إلى قمر GPS، ثم نعوض."},{"n":12,"color":"#b95c1b","page":56,"id":"34 (ج)","title":"GPS: السرعة المدارية للقمر","question":"(ج) كم تبلغ السرعة المدارية للقمر الاصطناعي؟","given":["Mₑ = 6.0 × 10²⁴ kg","r = 2.65 × 10⁷ m من الجزأين السابقين"],"added":["G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"سرعة القمر في مداره v.","why":"","principle":"","formulas":[{"formula":"GMm/r² = mv²/r","guide":"قوة الجاذبية هي القوة المركزية للقمر الصناعي."},{"formula":"v² = GM / r","guide":"نختصر كتلة القمر ونرتب حتى تصبح السرعة وحدها."},{"formula":"v = √(GM / r)","guide":"نأخذ الجذر التربيعي لإيجاد مقدار السرعة."}],"steps":[{"title":"نأخذ نصف قطر المدار","body":"r = 2.65 × 10⁷ m","guide":"نستخدم r المحسوب سابقًا من مركز الأرض."},{"title":"نعوض في قانون السرعة المدارية","body":"v = √[(6.67 × 10⁻¹¹ × 6.0 × 10²⁴) / (2.65 × 10⁷)]","guide":"نقسم GM على r داخل الجذر ثم نحسب الجذر."},{"title":"نحسب الناتج","body":"v ≈ 3886 m/s","guide":"الناتج بوحدة m/s لأنه مشتق من وحدات SI."},{"title":"نحوّل إلى km/s","body":"v ≈ 3.89 km/s","guide":"نقسم على 1000 حتى نكتب القيمة بالكيلومتر في الثانية."}],"result":"v ≈ 3.89 km/s","meaning":"سرعة حركة القمر مختلفة تمامًا عن سرعة انتشار موجة GPS التي تقارب سرعة الضوء.","warning":"لا تستخدمي c = 3 × 10⁸ m/s بوصفها سرعة القمر المدارية؛ هي سرعة الإشارة فقط.","hook":"هنا لا نحسب سرعة الضوء! المطلوب سرعة حركة قمر GPS حول الأرض، وهي أصغر بكثير."},{"n":13,"color":"#097e90","page":57,"id":"35 (أ)","title":"مقارنة جاذبية محطة الفضاء بالجاذبية السطحية","question":"يُجري رواد الفضاء تجارب في بيئة الجاذبية الصغرى على متن محطة الفضاء الدولية التي تدور على ارتفاع 416 km عن سطح الأرض. (أ) كم تبلغ النسبة بين شدة الجاذبية الأرضية على هذا الارتفاع وشدتها على سطح الأرض؟","given":["ارتفاع محطة الفضاء h = 416 km"],"added":["نصف قطر الأرض Rₑ = 6.4 × 10⁶ m"],"wanted":"النسبة g_h / g_0.","why":"","principle":"","formulas":[{"formula":"على السطح: g_0 = GM / R²","guide":"عند سطح الأرض، البعد من المركز يساوي نصف قطر الأرض."},{"formula":"عند المحطة: g_h = GM / (R + h)²","guide":"عند المحطة، البعد من المركز أكبر ويساوي R+h."},{"formula":"g_h / g_0 = [R / (R + h)]²","guide":"نقسم قيمة المجال هناك على المجال هنا؛ فتختصر كتلة الأرض وثابت الجذب."}],"steps":[{"title":"نحوّل الارتفاع إلى متر","body":"h = 416 × 1000 = 416,000 m","guide":"الارتفاع بالكيلومتر؛ نحوله إلى المتر ليطابق نصف قطر الأرض."},{"title":"نكتب نسبة المجالين","body":"g_h / g_0 = [6.4 × 10⁶ / (6.4 × 10⁶ + 416,000)]²","guide":"نضيف R وh داخل المقام قبل تربيع النسبة."},{"title":"نحسب النسبة","body":"g_h / g_0 ≈ 0.88166","guide":"النسبة 0.88 تعني أن الجاذبية أقل قليلًا من قيمتها السطحية."},{"title":"نحول إلى نسبة مئوية","body":"0.88166 × 100 ≈ 88.2%","guide":"عند ضرب كسر عشري في 100 نحصل على النسبة المئوية."}],"result":"الجاذبية عند المحطة ≈ 88.2% من الجاذبية السطحية.","meaning":"الجاذبية لا تزال قوية جدًا عند محطة الفضاء؛ الجاذبية الصغرى لا تعني انعدام قوة جذب الأرض.","warning":"لا تنسي تربيع الكسر كله، ولا تفترضي أن الجاذبية تساوي صفرًا بمجرد الابتعاد عن سطح الأرض.","hook":"رواد الفضاء قريبون نسبيًا من الأرض. سنقارن الجاذبية هناك بالجاذبية التي نعرفها على السطح."},{"n":14,"color":"#097e90","page":57,"id":"35 (ب)","title":"لماذا يشعر رواد الفضاء بانعدام الوزن؟","question":"(ب) اشرح كيف يمكن أن يكون رواد الفضاء «عديمي الوزن» فعليًا، رغم تأثرهم بجاذبية مساوية تقريبًا لتلك الموجودة على سطح الأرض.","given":["الجاذبية عند المحطة ≈ 88.2% من قيمتها على السطح.","المحطة تدور حول الأرض."],"added":[],"wanted":"تفسير انعدام الوزن الظاهري رغم وجود الجاذبية.","why":"","principle":"","formulas":[{"formula":"F_g = F_c","guide":"الأرض تجذب المحطة وروادها نحو المركز."},{"formula":"GMm/r² = mv²/r","guide":"الجاذبية تفسر تغير اتجاه الحركة المدارية."},{"formula":"في السقوط الحر: قوة الإسناد ≈ 0","guide":"قوة إسناد الأرضية تصبح شبه معدومة في السقوط الحر، لذا يشعر الرواد بانعدام الوزن."}],"steps":[{"title":"نفهم ما يحدث للمحطة","body":"الأرض تجذب المحطة وتجعلها تتسارع نحو مركزها باستمرار.","guide":"المحطة تتحرك أفقياً بسرعة كبيرة بينما تجذبها الأرض للداخل."},{"title":"نفهم ما يحدث للرواد","body":"الرواد يسقطون مع المحطة في المدار نفسه تقريبًا، ولذلك لا يضغطون على أرضيتها كما على سطح الأرض.","guide":"الرواد والمحطة يسقطون معًا، لذلك لا تضغط أقدامهم على أرضية المحطة كما نفعل على الأرض."},{"title":"نفسر الإحساس بانعدام الوزن","body":"عندما تقترب قوة الإسناد من الصفر، يصبح الوزن الظاهري قريبًا من الصفر مع بقاء الجاذبية.","guide":"ما انعدم تقريبًا هو الضغط أو الإسناد، وليس جذب الأرض."}],"result":"انعدام الوزن الظاهري سببه السقوط الحر المداري المستمر، وليس انعدام الجاذبية.","meaning":"المحطة والرواد يسقطون حول الأرض معًا، ولا تصطدم المحطة بالأرض لأن لديها سرعة أفقية مناسبة.","warning":"القول إن رواد الفضاء بلا جاذبية قول غير صحيح. ما ينعدم تقريبًا هو إحساس الإسناد (الوزن الظاهري).","hook":"قد يبدو الرواد وكأنهم يطفون بلا جاذبية، لكن الجاذبية هي نفسها التي تبقي محطتهم تدور!"},{"n":15,"color":"#665199","page":57,"id":"36","title":"الزمن الدوري لجسيم في حلقة زحل الخارجية","question":"لكوكب زحل العديد من الحلقات التي تحيط به، وهي تتكون من جسيمات صغيرة تدور حوله. فإذا كانت كتلة زحل تبلغ 5.69 × 10²⁶ kg والقطر الخارجي لإحدى الحلقات 2.72 × 10⁸ m، فكم يبلغ الزمن الدوري المداري لجسيم على الحافة الخارجية للحلقة كي يكمل مداره عليها؟","given":["كتلة زحل M = 5.69 × 10²⁶ kg","قطر الحلقة الخارجي D = 2.72 × 10⁸ m"],"added":["G = 6.67 × 10⁻¹¹ N·m²/kg²","نفترض مدارًا دائريًا لجسيم الحلقة."],"wanted":"الزمن الدوري المداري T.","why":"","principle":"","formulas":[{"formula":"r = D / 2","guide":"نصف القطر يساوي نصف القطر الكامل المعطى، لأن السؤال أعطى قطر الحلقة."},{"formula":"v = √(GM / r)","guide":"السرعة المدارية تُستنتج من تساوي جاذبية زحل والقوة المركزية."},{"formula":"T = 2πr / v","guide":"الجسيم يقطع محيط الدائرة في كل دورة."},{"formula":"T = 2π√[r³ / (GM)]","guide":"نعوض عن السرعة ثم نبسط لنحصل على الزمن باستخدام M وr فقط."}],"steps":[{"title":"نحسب نصف قطر مدار الجسيم","body":"r = 2.72 × 10⁸ / 2 = 1.36 × 10⁸ m","guide":"القطر يمتد من طرف الحلقة إلى الطرف المقابل، ونصفه هو r."},{"title":"نعوض في قانون الزمن الدوري","body":"T = 2π√[(1.36 × 10⁸)³ / (6.67 × 10⁻¹¹ × 5.69 × 10²⁶)]","guide":"أبقي القوس الذي يحتوي r³ كاملًا داخل الجذر."},{"title":"نحسب الزمن بالثواني","body":"T ≈ 51,153 s","guide":"الزمن بالثواني لأننا استخدمنا الوحدات الدولية."},{"title":"نحول إلى ساعات","body":"T = 51,153 / 3600 ≈ 14.21 h","guide":"كل ساعة 3600 ثانية، فنقسم الناتج حتى نحصل على عدد الساعات."}],"result":"T ≈ 14.2 ساعة","meaning":"جسيم عند الحافة الخارجية للحلقة يحتاج قرابة 14 ساعة و12 دقيقة لإكمال دورة حول زحل.","warning":"المعطى هو القطر D، والقانون يستخدم نصف القطر r = D/2؛ استخدام القطر سيعطي قيمة خاطئة جدًا.","hook":"زحل محاط بحلقات من جسيمات صغيرة. لنعرف مدة دورة جسيم واحد نحتاج طول المدار وسرعته."}];
const LAW_DATA=[{"id":"gravity","title":"قانون نيوتن للجذب العام","sub":"لماذا تجذب الأرض القمر، وتستطيع الشمس جذب الكواكب؟","intro":"تخيّلي جسمين لهما كتلة. كل جسم يجذب الآخر. الأجسام الضخمة مثل الأرض والشمس تصنع قوة جذب كبيرة، وتقل هذه القوة إذا أبعدنا الجسم الصغير عنها.","steps":[["الفكرة بالكلمات","قوة الجاذبية تتناسب طرديًا مع حاصل ضرب الكتلتين، وعكسيًا مع مربع المسافة بين مركزيهما.","F_g = GMm / r²"],["معنى الرموز","M كتلة الأرض أو الشمس، وm كتلة القمر أو الكوكب، وr المسافة من المركز إلى المركز، وG ثابت الجذب العام.","G = 6.67 × 10⁻¹¹ N·m²/kg²"],["ماذا يحدث عندما يزيد البعد؟","إذا ضاعفتِ البعد r مرتين، يصبح مربع البعد أربعة أمثال، فتضعف قوة الجذب إلى الربع.","F_g الجديد = F_g القديم / 4"]],"use":"نستخدم هذا القانون عند دراسة قوة الجذب والأقمار والكواكب، وهو بداية اشتقاق علاقات الحركة المدارية.","alert":"r هي المسافة بين المركزين، وليست الارتفاع فوق السطح."},{"id":"centripetal","title":"القوة المركزية والحركة الدائرية","sub":"كيف يستمر الجسم في الحركة حول المركز بدل أن يتحرك بخط مستقيم؟","intro":"حتى إذا ظل مقدار سرعة القمر ثابتًا، فإن اتجاه السرعة يتغير طوال دورانه. يحتاج هذا التغير إلى قوة تتجه نحو المركز.","steps":[["نفهم الاتجاه","السرعة المماسية تتجه على امتداد المسار، أما القوة المركزية فتتجه إلى داخل الدائرة."],["نكتب مقدار القوة المركزية","تزداد هذه القوة بزيادة الكتلة أو مربع السرعة، وتقل عند زيادة نصف قطر المسار.","F_c = mv² / r"],["من يوفر القوة في مدار القمر؟","جاذبية الأرض هي القوة المركزية نفسها؛ لا نضيف قوة جديدة فوق الجاذبية.","F_g = F_c"]],"use":"مفتاح فهم كل المسائل المدارية واشتقاق السرعة والزمن الدوري.","alert":"القوة المركزية اسم لدور القوة واتجاهها، وليست قوة مستقلة تضاف إلى قوة الجاذبية."},{"id":"speed","title":"اشتقاق السرعة المدارية","sub":"لماذا تكون سرعة القمر الدائري أقرب إلى الأرض أكبر؟","intro":"نريد معرفة مقدار السرعة v لجسم يدور في مدار دائري حول كتلة كبيرة M. نبدأ بقوة الجاذبية التي تؤدي وظيفة القوة المركزية.","steps":[["القانون الأول","قوة الجاذبية بين الجسمين.","F_g = GMm / r²"],["القانون الثاني","مقدار القوة المركزية المطلوبة للحركة الدائرية.","F_c = mv² / r"],["نساوي القوتين","لأن الجاذبية نفسها هي القوة التي تجعل القمر يدور.","GMm / r² = mv² / r"],["نختصر كتلة القمر","توجد m في طرفي المعادلة، فتختصر، ثم نضرب في r.","v² = GM / r"],["نأخذ الجذر التربيعي","لإيجاد v بدل v².","v = √(GM / r)"]],"use":"عندما يُطلب حساب سرعة قمر اصطناعي أو جسيم في حلقة زحل، ونستخدم r من مركز الجسم المركزي.","alert":"هذا الاشتقاق للمدار الدائري، ولا نخلط بين v المدارية وسرعة الإشارة الكهرومغناطيسية."},{"id":"period","title":"الزمن الدوري من المسافة والسرعة","sub":"كيف نحسب المدة التي يستغرقها القمر لإكمال دورة؟","intro":"تخيّلي عدّاءً يقطع مسارًا دائريًا. لمعرفة زمن دورة كاملة نعرف طول الطريق، ثم نقسمه على السرعة.","steps":[["القانون الذي نعرفه","الزمن = المسافة ÷ السرعة.","t = d / v"],["نحدد المسافة الصحيحة","المسافة في دورة دائرية واحدة هي محيط الدائرة.","d = 2πr"],["نعوض في قانون الزمن","نسمي زمن الدورة الكاملة T.","T = 2πr / v"],["نفهم الوحدات","إذا كان r بالمتر وv بالمتر لكل ثانية، فإن الناتج بالثواني.","s = m / (m/s)"]],"use":"في حساب الزمن الدوري للأقمار الاصطناعية، ويمكن الجمع مع قانون السرعة المدارية إذا لم تكن السرعة معطاة.","alert":"الارتفاع h ليس المسافة التي يقطعها القمر في دورة؛ استخدمي محيط المدار."},{"id":"radius","title":"اشتقاق نصف قطر المدار من الزمن الدوري","sub":"إذا عرفنا زمن الدورة فقط، فكيف نجد بعد القمر عن المركز؟","intro":"نجمع قانونًا من الجاذبية وقانونًا من الحركة المنتظمة، ثم نستبدل السرعة حتى يصبح المجهول الوحيد هو r.","steps":[["نساوي الجاذبية بالقوة المركزية","ونختصر كتلة القمر الصغيرة.","v² = GM / r"],["نعبّر عن السرعة بالزمن","محيط المدار على الزمن الدوري.","v = 2πr / T"],["نعوض عن v","نضع التعبير الثاني مكان v في المعادلة الأولى.","(2πr / T)² = GM / r"],["نرتب الخطوات","نربع الطرف الأيسر ثم نضرب في r وT².","4π²r³ = GMT²"],["نستخرج r³","نقسم على 4π².","r³ = GMT² / (4π²)"],["نأخذ الجذر التكعيبي","لأننا نريد r وليس r³.","r = ∛[GMT² / (4π²)]"]],"use":"في حساب نصف قطر المدار المتزامن، أو بعد كوكب عن الشمس عند معرفة زمن دورته.","alert":"هذا اشتقاق مباشر من قوانين نيوتن والحركة الدائرية. الزمن يجب أن يكون بالثواني عند استخدام وحدات SI."},{"id":"centralmass","title":"اشتقاق كتلة الشمس من حركة الأرض","sub":"كيف نعرف كتلة الشمس دون وضعها على ميزان؟","intro":"الأرض تدور لأن الشمس تجذبها. يمكن استنتاج كتلة الشمس إذا عرفنا نصف قطر مدار الأرض والزمن الذي تستغرقه لإكمال دورة.","steps":[["قوة جذب الشمس = القوة المركزية","كتلة الشمس M وكتلة الأرض الصغيرة m.","GMm / r² = mv² / r"],["نختصر m","كتلة الأرض تختفي من طرفي المعادلة.","GM = v²r"],["نعوض السرعة من زمن الدورة","نستخدم v = 2πr / T.","GM = 4π²r³ / T²"],["نقسم على G","فنصل إلى كتلة الجسم المركزي.","M = 4π²r³ / (GT²)"]],"use":"لحساب كتلة الشمس أو كتلة أي جسم مركزي من حركة قمر أو كوكب حوله.","alert":"كتلة الأرض قد تظهر في المعطيات لكنها تختصر في الاشتقاق؛ لا نستخدمها في القانون النهائي."},{"id":"gravityfield","title":"شدة مجال الجاذبية ومقارنتها","sub":"لماذا تضعف الجاذبية كلما ارتفعنا فوق سطح الأرض؟","intro":"المجال يخبرنا مقدار قوة الجذب المؤثرة في كل كيلوغرام من الكتلة عند مكان معين.","steps":[["تعريف شدة المجال","قوة الجاذبية مقسومة على كتلة الجسم الذي نختبر به المجال.","g = F_g / m"],["نعوض بقانون الجذب العام","نضع GMm/r² بدل F_g.","g = (GMm / r²) / m"],["نختصر m","فينتج قانون مجال الجاذبية عند البعد r.","g = GM / r²"],["عند سطح الأرض","المسافة من المركز إلى السطح هي R.","g_0 = GM / R²"],["عند ارتفاع h","المسافة من المركز هي R+h.","g_h = GM / (R + h)²"],["نقارن النسبتين","نقسم علاقة الارتفاع على علاقة السطح وتختصر G وM.","g_h / g_0 = [R / (R + h)]²"]],"use":"لحساب g عند ارتفاع قمر GPS، أو مقارنة جاذبية محطة الفضاء بقيمة الجاذبية على السطح.","alert":"وجود جاذبية أقل لا يعني انعدام الجاذبية؛ إن وحدة g هي N/kg وتكافئ m/s²."},{"id":"radiusalt","title":"نصف قطر المدار والارتفاع والقطر","sub":"ثلاث كلمات متشابهة، ولكنها تعني مسافات مختلفة.","intro":"نصف القطر المداري يُقاس من مركز الأرض، بينما ارتفاع القمر يُقاس بدءًا من سطحها، والقطر يبلغ ضعفي نصف القطر.","steps":[["من السطح إلى المدار","نضيف ارتفاع القمر إلى نصف قطر الأرض.","r = R + h"],["من المدار إلى الارتفاع","إذا عرفنا r ونريد h، نطرح نصف قطر الأرض.","h = r − R"],["القطر في حلقات زحل","إذا أُعطينا قطر مدار دائري، نقسمه على 2.","r = D / 2"]],"use":"تقريبًا في كل المسائل العددية؛ خصوصًا مسائل 3 و34 و36.","alert":"الخلط بين r وh هو أحد أكثر أسباب الإجابات الخاطئة."},{"id":"sync","title":"القمر المتزامن مع دوران الأرض","sub":"كيف يبدو القمر ثابتًا فوق مكان معيّن؟","intro":"لكي يدور القمر بنفس وتيرة دوران الأرض، يجب أن يساوي زمنه الدوري زمن دوران الأرض حول محورها بالنسبة للنجوم.","steps":[["شرط الزمن","الزمن الدوري للقمر المتزامن يساوي زمن دوران الأرض المعطى.","T القمر = T الأرض"],["نستخدم قانون المدار المستنتج","نصف قطر المدار يعتمد على M وT.","r = ∛[GMT²/(4π²)]"],["إذا قلّ طول اليوم","عند ثبات كتلة الأرض، يقل r أيضًا."],["إذا زادت كتلة الأرض","عند ثبات T، يزيد r."],["لثبات القمر في السماء فوق نقطة واحدة","يلزم أيضًا مدار دائري استوائي باتجاه دوران الأرض."]],"use":"السؤال 4 عن المدار المتزامن والسؤال 8 عن تغير طول اليوم أو كتلة الأرض.","alert":"زمن 86,164 ثانية هو اليوم النجمي تقريبًا، أما اليوم الشمسي المعتاد فيقارب 24 ساعة."},{"id":"signals","title":"GPS: مسافة الإشارة مقابل سرعة المدار","sub":"لماذا نستخدم سرعة الضوء في جزء، وقانون الجاذبية في جزء آخر؟","intro":"عند استقبال جهاز أرضي إشارة GPS تحدث حركتان مختلفتان: القمر يدور حول الأرض، والإشارة تنتقل من القمر إلى الجهاز.","steps":[["مسافة الإشارة اللاسلكية","المسافة = سرعة انتشار الموجة × زمن رحلتها.","d = c × t"],["ما سرعة c؟","سرعة الضوء التقريبية في الفراغ.","c = 3 × 10⁸ m/s"],["ما سرعة القمر حول الأرض؟","نستخدم قانون السرعة المدارية بدلًا من سرعة الإشارة.","v = √(GM / r)"],["متى تكون مسافة الإشارة ارتفاعًا؟","فقط في الفرض المبسط إذا كان القمر فوق المستقبل مباشرة، مع إهمال التأخيرات الإضافية."]],"use":"المسألة 34 بأجزائها (أ) و(ب) و(ج).","alert":"إذا كان القمر مائلًا عن المستقبل فإن مسافة الإشارة خط مائل، ولا يمكن اعتبارها ارتفاعًا دون معلومة هندسية إضافية."},{"id":"freefall","title":"انعدام الوزن الظاهري والسقوط الحر","sub":"هل انعدمت جاذبية الأرض عند رواد محطة الفضاء؟","intro":"محطة الفضاء والرواد يتأثرون بجاذبية قوية، لكنهم في حالة سقوط حر حول الأرض، ولذلك يبدو الرواد وكأنهم يطفون.","steps":[["الجاذبية لم تختف","الأرض تجذب المحطة والرواد إلى مركزها.","F_g = GMm / r²"],["كيف يواصلون الدوران؟","سرعتهم الأفقية تجعلهم يسقطون حول الأرض بدل الاصطدام بها."],["لماذا لا يشعرون بالوزن؟","لأن الرواد والمحطة يسقطون معًا، فلا تكاد توجد قوة إسناد من أرضية المحطة."],["ماذا نقصد بالوزن الظاهري؟","هو الإحساس المرتبط بقوة الإسناد. وقد يكون قريبًا من الصفر رغم وجود قوة الجاذبية."]],"use":"المسألة 35 (ب)، وفهم الجاذبية عند محطة الفضاء الدولية.","alert":"لا تقولي إن قوة الجاذبية تساوي صفرًا؛ الذي يقترب من الصفر هو الوزن الظاهري."},{"id":"compare","title":"مقارنة سرعات الكواكب وأزمنة دوراتها","sub":"كيف نقارن بين مدارين حول الشمس دون حساب جميع الثوابت؟","intro":"إذا دار كوكبان حول الشمس نفسها، يبقى G وكتلة الشمس ثابتين. لذلك نستطيع مقارنة السرعات والأزمنة باستعمال النسب.","steps":[["نبدأ من قانون السرعة المدارية","المسافة الأكبر تعني سرعة دائرية أقل حول الجسم المركزي نفسه.","v = √(GM / r)"],["نقسم السرعتين","تختصر G وM في النسبة.","v_p / v_e = √(r_e / r_p)"],["نقارن الزمنين","من الزمن = المحيط على السرعة.","T_p / T_e = (r_p / r_e) × (v_e / v_p)"],["مثال النسبة 14","إذا كان المدار الجديد أبعد 14 مرة، تقل سرعته بمعامل √14 ويطول زمنه بمعامل 14√14.","T_p / T_e = 14√14"]],"use":"السؤال 7 والمقارنات بين الكواكب حول الجسم المركزي نفسه.","alert":"زيادة نصف القطر لا تعني زيادة زمن الدورة بالنسبة نفسها فقط؛ السرعة المدارية تتغير أيضًا."}];

const p=problem(s.problem),ix=PROBLEMS.indexOf(p),previous=PROBLEMS[ix-1],next=PROBLEMS[ix+1];
const jump=p.parts.length>1?'<nav class="jumps">'+p.parts.map(n=>'<a href="#part-'+n+'">السؤال '+e(DATA[n].id)+'</a>').join('')+'</nav>':'';
return show('<div class="question-group"><div class="back">'+btn('→ صفحة الكتاب '+p.page,'page('+p.page+')')+'<small>صفحة '+p.page+' • السؤال '+p.num+'</small></div><header class="group-head"><div class="eyebrow">شرح كامل دون استعجال</div><h1>السؤال '+p.num+' — '+e(p.title)+'</h1><p>جميع أجزاء المسألة متتابعة بترتيبها، ولكل جزء مساحته.</p>'+jump+'</header>'+p.parts.map(i=>part(DATA[i])).join('')+foot(previous?btn('→ السؤال السابق','choose('+previous.num+')'):btn('→ صفحة '+p.page,'page('+p.page+')'),next?btn('السؤال التالي ←','choose('+next.num+')',true):btn('فهرس المسائل ←',"tab('solved')",true))+'</div>')}
function render(){if(s.tab==='pages')pages();if(s.tab==='laws')laws();if(s.tab==='derivations')derivations();if(s.tab==='symbols')sym();if(s.tab==='summaries')summaries();if(s.tab==='solved')solved();if(s.tab==='focus')focus();if(s.tab==='rest')rest()}
function focus(){const x=FLASH[s.flash];show('<div class="narrow"><div class="eyebrow">ومضات مراجعة اختيارية</div><h1 class="title">ومضة تركيز واحدة</h1><p class="subtitle">تظهر فكرة قصيرة 12 ثانية إذا أردتِ، ويمكن كشفها دون توقيت. لا توجد درجات ولا منافسة.</p></div><div class="focusbox"><div class="eyebrow">'+(s.flash+1)+' من '+FLASH.length+'</div><h2 id="focusTitle">'+(s.flashShown?e(x[0]):'الفكرة جاهزة')+'</h2><p id="focusMsg">'+(s.flashShown?e(x[2]):'ابدئي متى أردتِ')+'</p><div id="focusFormula">'+(s.flashShown?eq(x[1]):'')+'</div><div class="fine" id="focusClock"></div><div class="controls"><button class="pbtn primary" onclick="beginFlash()">عرض 12 ثانية</button><button class="pbtn" onclick="showFlash()">عرض بلا توقيت</button><button class="pbtn" onclick="nextFlash()">الومضة التالية ←</button></div></div>')}
function beginFlash(){clearTimers();s.flashShown=true;s.flashSec=12;focus();timer=setInterval(()=>{s.flashSec--;const v=el('focusClock');if(v)v.textContent='باقي '+s.flashSec+' ثانية';if(s.flashSec<=0){clearTimers();s.flashShown=false;focus();}},1000)}
function showFlash(){clearTimers();s.flashShown=true;focus()}
function nextFlash(){clearTimers();s.flash=(s.flash+1)%FLASH.length;s.flashShown=false;focus()}
function rest(){show('<div class="narrow"><div class="eyebrow">استراحة قصيرة دون ضغط</div><h1 class="title">استراحة هادئة</h1><p class="subtitle">يمكنكِ البقاء قليلًا هنا. تتغير الرسائل تلقائيًا كل 9 ثوانٍ، أو يمكنكِ تغييرها بنفسك.</p></div><div class="focusbox"><div class="circle"></div><h2>رسالة تشجيعية</h2><p id="restMsg">'+e(MESSAGES[s.rest])+'</p><div class="fine">'+(s.paused?'تم إيقاف التغيير التلقائي':'الرسائل تتغير بهدوء')+'</div><div class="controls"><button class="pbtn" onclick="nextRest()">رسالة أخرى</button><button class="pbtn primary" onclick="toggleRest()">'+(s.paused?'استئناف الرسائل':'إيقاف التغيير')+'</button><button class="pbtn" onclick="tab(\'pages\')">العودة إلى الكتاب</button></div></div>');if(!s.paused)restTimer=setInterval(()=>{s.rest=(s.rest+1)%MESSAGES.length;if(el('restMsg'))el('restMsg').textContent=MESSAGES[s.rest]},9000)}
function nextRest(){s.rest=(s.rest+1)%MESSAGES.length;el('restMsg').textContent=MESSAGES[s.rest]}
function toggleRest(){clearTimers();s.paused=!s.paused;rest()}
function togglePrint(force){const menu=el('printMenu'),open=typeof force==='boolean'?force:menu.hidden;menu.hidden=!open;el('printButton').setAttribute('aria-expanded',String(open))}
document.addEventListener('pointerdown',event=>{if(!el('printer').contains(event.target))togglePrint(false)});
document.addEventListener('keydown',event=>{if(event.key==='Escape')togglePrint(false)});
function textKey(i){return 'hafsa_orbit_text_v5_'+i}
function drawKey(i){return 'hafsa_orbit_ink_v5_'+i}
function typed(i){try{return localStorage.getItem(textKey(i))||''}catch(err){return ''}}
function readStore(key,def){try{return JSON.parse(localStorage.getItem(key))||def}catch(err){return def}}
function saveStore(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch(err){}}
const lines={},tools={},live={},bound=new WeakSet();
function strokes(i){if(!lines[i])lines[i]=readStore(drawKey(i),[]);return lines[i]}
function draw(ctx,st,w,h,scale){ctx.clearRect(0,0,w,h);for(const v of st){if(!v.points?.length)continue;ctx.save();ctx.lineWidth=(v.tool==='eraser'?22:3.5)*scale;ctx.strokeStyle=v.tool==='eraser'?'#fff':'#243b48';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(v.points[0][0]*w,v.points[0][1]*h);if(v.points.length===1)ctx.lineTo(v.points[0][0]*w+0.1,v.points[0][1]*h+0.1);for(let j=1;j<v.points.length;j++)ctx.lineTo(v.points[j][0]*w,v.points[j][1]*h);ctx.stroke();ctx.restore()}}
function redraw(i){const c=el('ink-'+i);if(!c)return;const r=c.getBoundingClientRect();if(r.width<20)return;const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*ratio),h=Math.round(r.height*ratio);if(c.width!==w||c.height!==h){c.width=w;c.height=h}draw(c.getContext('2d'),strokes(i).concat(live[i]?[live[i]]:[]),w,h,ratio)}
function bindInk(i){const c=el('ink-'+i);if(!c||bound.has(c))return;bound.add(c);const pt=event=>{const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(event.clientY-r.top)/r.height))]};c.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button!==0)return;live[i]={tool:tools[i]||'pen',points:[pt(event)],pointer:event.pointerId};c.setPointerCapture(event.pointerId);event.preventDefault();redraw(i)});c.addEventListener('pointermove',event=>{if(!live[i]||live[i].pointer!==event.pointerId)return;live[i].points.push(pt(event));redraw(i)});const end=event=>{if(!live[i]||live[i].pointer!==event.pointerId)return;strokes(i).push(live[i]);delete live[i];saveStore(drawKey(i),strokes(i));redraw(i)};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);if('ResizeObserver' in window){const ob=new ResizeObserver(()=>redraw(i));ob.observe(c)}redraw(i)}
function chooseTool(i,t){tools[i]=t;if(el('pen-'+i))el('pen-'+i).classList.toggle('on',t==='pen');if(el('erase-'+i))el('erase-'+i).classList.toggle('on',t==='eraser')}
function undo(i){strokes(i).pop();saveStore(drawKey(i),strokes(i));redraw(i)}
function clearBoard(i){if(!confirm('هل تريدين مسح الكتابة في هذا الجزء؟'))return;lines[i]=[];saveStore(drawKey(i),[]);redraw(i)}
document.addEventListener('toggle',event=>{const v=event.target;if(v.id?.startsWith('practice-')&&v.open){const i=Number(v.id.slice(9));requestAnimationFrame(()=>bindInk(i))}},true);
document.addEventListener('input',event=>{if(event.target.id?.startsWith('typed-')){const i=Number(event.target.id.slice(6));try{localStorage.setItem(textKey(i),event.target.value)}catch(err){}}});
function exportInk(i){const data=strokes(i);if(!data.length)return '';const c=document.createElement('canvas');c.width=1000;c.height=350;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1000,350);draw(ctx,data,1000,350,1.2);return c.toDataURL('image/png')}
function printCover(){return '<section class="pcov"><small>مدرسة العب الثانوية للبنات • قسم الفيزياء</small><h1>دليل الحركة المدارية</h1><p>القوانين والاشتقاقات والمسائل المحلولة للصف الثاني عشر</p><b>إعداد وتصميم: الأستاذة حفصة طيبي</b><p>2026 - 2027</p></section>'}
function printPage(n){const g=gpage(n);return '<section class="pch"><strong>'+n+'</strong><h2>'+e(g.title)+'</h2><p>'+e(g.sub)+'</p></section>'}
function printPart(l){const notes=typed(l.n),image=exportInk(l.n);return '<section class="psection" style="--c:'+gpage(l.page).color+'"><h2>السؤال '+e(l.id)+' — '+e(l.title)+'</h2><h3>نص السؤال</h3><div class="question">'+e(l.question)+'</div><h3>المعطيات</h3>'+ul(l.given)+(l.added.length?'<h3 class="redlabel">المعطيات المضافة</h3>'+ul(l.added,'red'):'')+'<h3>المطلوب</h3><p class="para">'+e(l.wanted)+'</p><h3>الفكرة المبسطة</h3><p class="para">'+e(l.hook)+'</p><h3>القوانين وسبب استخدامها</h3>'+l.formulas.map((v,i)=>step({title:'القانون '+(i+1),body:v.guide,formula:v.formula},i)).join('')+'<h3>التحويلات</h3>'+conversion(l)+'<h3>خطوات الحل</h3>'+l.steps.map((v,i)=>step(v,i,v.guide)).join('')+'<div class="answer"><b>الإجابة</b><p>'+e(l.result)+'</p></div><p class="para">'+e(l.meaning)+'</p><div class="warn"><b>تنبيه علمي</b>'+e(l.warning)+'</div>'+((notes||image)?'<h3>محاولتي الخاصة</h3><p style="white-space:pre-wrap">'+e(notes)+'</p>'+(image?'<img class="printink" src="'+image+'">':''):'<h3>مساحة للحل على الورق</h3><div class="printlines"></div>')+'</section>'}
function printProblems(p){return p.parts.map(i=>printPart(DATA[i])).join('')}
function printLaws(){return '<section class="psection"><h2>القوانين الأساسية</h2><div class="grid">'+FORMULAS.map(v=>'<div class="lawcard"><h3>'+e(v[0])+'</h3>'+eq(v[1])+'<p>'+e(v[2])+'</p></div>').join('')+'</div></section>'+LAW_DATA.map(v=>'<section class="psection"><h2>'+e(v.title)+'</h2><p class="para">'+e(v.intro)+'</p>'+v.steps.map((x,i)=>step({title:x[0],body:x[1],formula:x[2]||''},i)).join('')+'</section>').join('')}
function printSymbols(){return '<section class="psection"><h2>الرموز والثوابت</h2><table class="symtable"><tbody>'+SYMBOLS.map(x=>'<tr>'+x.map(t=>'<td>'+e(t)+'</td>').join('')+'</tr>').join('')+'</tbody></table></section>'}
function printDefs(){return '<section class="psection"><h2>ملخصات وتعاريف</h2><div class="defgrid">'+DEFS.map(x=>'<div class="defcard"><h3>'+e(x[0])+'</h3><p>'+e(x[1])+'</p><small>'+e(x[2])+'</small></div>').join('')+'</div></section>'}
function printGuide(mode){togglePrint(false);let output='';if(mode==='current'){if(s.problem===null){alert('افتحي مسألة محلولة أولًا ثم اختاري طباعة المسألة المفتوحة.');return}output=printProblems(problem(s.problem))}else if(mode==='page'){if(!s.page){alert('اختاري صفحة الكتاب أولًا.');return}output=printPage(s.page)+PROBLEMS.filter(x=>x.page===s.page).map(printProblems).join('')}else if(mode==='laws'){output=printCover()+printLaws()+printSymbols()}else if(mode==='all'){output=printCover()+printLaws()+printSymbols()+printDefs()+GROUPS.map(g=>printPage(g.n)+PROBLEMS.filter(x=>x.page===g.n).map(printProblems).join('')).join('')}el('printRoot').innerHTML=output;const fire=()=>window.print();if(document.fonts?.ready)document.fonts.ready.then(()=>requestAnimationFrame(fire)).catch(fire);else requestAnimationFrame(fire)}
window.addEventListener('beforeprint',()=>{if(!el('printRoot').innerHTML){el('printRoot').innerHTML=printCover()+printLaws()+printSymbols()+printDefs()+GROUPS.map(g=>printPage(g.n)+PROBLEMS.filter(x=>x.page===g.n).map(printProblems).join('')).join('')}});
render();
</script></body></html>
