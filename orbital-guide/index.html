<script>
const EXERCISES=/*EXERCISE_DATA*/[{"n":0,"color":"#2858b8","page":49,"id":"2","title":"تأثير الاحتكاك في سرعة القمر الاصطناعي","question":"عندما يتعرض القمر الاصطناعي لقوى احتكاك في مداره، فإنه يتخذ مدارًا حلزونيًا يقترب فيه من الأرض. كيف يؤثر ذلك في سرعته الخطية (المماسية)؟ وضّح إجابتك.","given":["القمر يتعرض للاحتكاك ويفقد جزءًا من طاقته الميكانيكية.","مساره يقترب تدريجيًا من الأرض."],"added":[],"wanted":"تفسير أثر الاقتراب من الأرض في السرعة المماسية.","why":"","principle":"","formulas":[{"formula":"F_g = GMm / r²","guide":"هذه القوة تجذب القمر إلى داخل المدار، وكلما اقترب زادت قوة جذب الأرض له."},{"formula":"F_c = mv² / r","guide":"الجسم الذي يتحرك في دائرة يحتاج قوة تشدّه نحو المركز؛ في هذه المسألة الجاذبية نفسها تؤدي هذا الدور."},{"formula":"F_g = F_c  ⟹  v = √(GM / r)","guide":"عندما نساوي القوتين ونبسط، نجد أن السرعة الدائرية تصبح أكبر إذا صغر r."}],"steps":[{"title":"نبدأ من حركة القمر الدائرية","body":"تتجه قوة الجاذبية نحو مركز الأرض وتوفر القوة المركزية.","guide":"حتى لو بدت حركة القمر ثابتة من بعيد، فإن اتجاه سرعته يتغير دائمًا بسبب الجاذبية."},{"title":"ننظر إلى أثر الاحتكاك","body":"يفقد القمر طاقة ميكانيكية، فيهبط تدريجيًا نحو الأرض.","guide":"الاحتكاك يسحب طاقة من الحركة، فتقل الطاقة الميكانيكية ويبدأ المدار بالهبوط."},{"title":"نقارن بين مدارين دائريين","body":"في المدار الأدنى يصغر r، ولذلك تزداد قيمة v = √(GM/r) عند ثبات G وM.","guide":"انتبهي: النتيجة تقارن سرعتين لمدارين دائريين؛ وليست وصفًا لكل ثانية من مسار الهبوط الحلزوني."}],"result":"في المدار الدائري الأدنى تكون السرعة المدارية أكبر.","meaning":"فقد الطاقة الكلية لا يعني بالضرورة أن طاقة الحركة أصغر؛ إذ تتغير طاقة وضع الجاذبية أيضًا.","warning":"العلاقة v = √(GM/r) تصف المدار الدائري. أثناء الهبوط الحلزوني المصحوب بمقاومة لا تكون الحركة دائرة مثالية ولا يلزم أن تتزايد السرعة في كل لحظة.","hook":"تخيّلي قمرًا كان يدور بعيدًا ثم صار أقرب إلى الأرض. هل نقارن سرعة قمر في مدارين مختلفين أم لحظة تأثره بالاحتكاك؟ الفرق مهم."},{"n":1,"color":"#813ab1","page":49,"id":"3 (أ)","title":"السرعة المماسية لقمر على ارتفاع 5900 km","question":"افترض أن قمرًا اصطناعيًا يدور على ارتفاع 5900 km فوق سطح الأرض. (أ) احسب سرعته المماسية.","given":["الارتفاع عن السطح: h = 5900 km"],"added":["نصف قطر الأرض R = 6.4 × 10⁶ m","كتلة الأرض M = 6.0 × 10²⁴ kg","ثابت الجذب G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"السرعة المماسية المدارية v.","why":"","principle":"","formulas":[{"formula":"GMm / r² = mv² / r","guide":"نكتب قوة الجذب التي تبقي القمر قريبًا من الأرض."},{"formula":"GM / r = v²","guide":"القمر لا يتحرك مستقيمًا؛ يحتاج قوة تغير اتجاه سرعته باستمرار."},{"formula":"v = √(GM / r)","guide":"توجد كتلة القمر m في الطرفين؛ عندما نختصرها تظهر السرعة التي نريد حسابها."}],"steps":[{"title":"تحويل الارتفاع إلى المتر","body":"h = 5900 × 1000 = 5.9 × 10⁶ m","guide":"الكيلو متر أكبر من المتر ألف مرة؛ ولذلك نضرب في 1000."},{"title":"إيجاد نصف قطر المدار","body":"r = R + h = 6.4 × 10⁶ + 5.9 × 10⁶ = 1.23 × 10⁷ m","guide":"الرقم 5900 km ارتفاع عن السطح، بينما القانون يطلب المسافة من مركز الأرض."},{"title":"التعويض بالقيم المناسبة","body":"v = √[(6.67 × 10⁻¹¹ × 6.0 × 10²⁴) / (1.23 × 10⁷)]","guide":"نضع كتلة الأرض ونصف قطر المدار داخل القانون بعد توحيد الوحدات."},{"title":"حساب الناتج","body":"v ≈ 5704 m/s = 5.70 km/s","guide":"نقسم داخل الجذر أولًا ثم نحسب الجذر التربيعي؛ وعند التحويل إلى km/s نقسم على 1000."}],"result":"v ≈ 5.70 km/s","meaning":"يقطع القمر نحو 5.70 كيلومتر كل ثانية أثناء حركته حول الأرض في المدار المفترض.","warning":"لا تعوّضي عن r بارتفاع 5900 km؛ نصف قطر المدار يساوي R + h، واحرصي على استخدام وحدة المتر.","hook":"تخيّلي أنك تقيسين مكان القمر من وسط الأرض لا من سطحها. لهذا نجمع نصف قطر الأرض مع الارتفاع."},{"n":2,"color":"#813ab1","page":49,"id":"3 (ب)","title":"الزمن الدوري للقمر الاصطناعي","question":"افترض أن قمرًا اصطناعيًا يدور على ارتفاع 5900 km فوق سطح الأرض. (ب) احسب الزمن الدوري لدورانه.","given":["h = 5900 km","من الجزء (أ): r = 1.23 × 10⁷ m، والسرعة ≈ 5704 m/s"],"added":[],"wanted":"الزمن الدوري T بالدقائق أو الساعات.","why":"","principle":"","formulas":[{"formula":"t = d / v","guide":"هذا هو القانون البسيط الذي نستخدمه حتى في المشي والسيارات: الزمن يساوي المسافة على السرعة."},{"formula":"d = 2πr","guide":"بما أن الرحلة دورة دائرية كاملة فالمسافة ليست الارتفاع، بل محيط الدائرة."},{"formula":"T = 2πr / v","guide":"نعوّض عن المسافة بالمحيط ونستخدم سرعة القمر التي حسبناها في الجزء السابق."}],"steps":[{"title":"نحدد المسافة في دورة كاملة","body":"d = 2π × 1.23 × 10⁷ m","guide":"هذه المسافة من مركز الأرض للقمر هي نصف قطر المسار كله."},{"title":"نعوض بالسرعة المحسوبة","body":"T = (2π × 1.23 × 10⁷) / 5704","guide":"نستخدم السرعة المحسوبة سابقًا، لا نعيد استخدام الارتفاع على أنه سرعة."},{"title":"نحسب الزمن بالثواني","body":"T ≈ 13,549 s","guide":"بعد أن نكتب محيط الدائرة نقسم على السرعة بوحدة m/s؛ الناتج سيكون بالثواني."},{"title":"نحول إلى ساعات","body":"T = 13,549 / 3600 ≈ 3.76 h","guide":"كل ساعة 3600 ثانية؛ لذلك نحول الناتج إلى ساعات بالقسمة."}],"result":"T ≈ 13,549 s ≈ 3.76 ساعة","meaning":"زمن الدورة الواحدة يقارب 3 ساعات و46 دقيقة.","warning":"السرعة هنا سرعة القمر المدارية. لا تستخدمي الارتفاع بوصفه مسافة دورة كاملة.","hook":"تخيّلي القمر عند نقطة البداية، ثم انتظري حتى يعود إلى النقطة نفسها؛ هذا هو الزمن الدوري. نحتاج طول الرحلة كلها."},{"n":3,"color":"#077e66","page":49,"id":"4","title":"نصف قطر المدار المتزامن مع الأرض","question":"إذا كان الزمن الدوري لدوران الأرض حول نفسها 86,164 ثانية، احسب نصف قطر مدار القمر الاصطناعي المتزامن مع الأرض.","given":["الزمن الدوري T = 86,164 s"],"added":["كتلة الأرض M = 6.0 × 10²⁴ kg","G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"نصف قطر المدار r من مركز الأرض.","why":"","principle":"","formulas":[{"formula":"GMm / r² = mv² / r","guide":"هذه الخطوة الأولى: نعرف كيف تتوازن الحركة الدائرية مع جذب الأرض."},{"formula":"v = 2πr / T","guide":"نريد استبدال السرعة بعلاقة تحتوي على الزمن المعروف في السؤال."},{"formula":"(2πr / T)² = GM / r","guide":"وضعنا 2πr/T مكان v؛ لذلك صار لدينا r وT بدل v."},{"formula":"r³ = GMT² / (4π²)","guide":"نرتب الحدود ونأخذ الجذر التكعيبي؛ لأن نصف القطر ظهر مرفوعًا للقوة 3."},{"formula":"r = ∛[GMT² / (4π²)]","guide":"هذه الصيغة النهائية تستخدم الزمن وكتلة الأرض لإيجاد نصف القطر."}],"steps":[{"title":"نثبت الزمن الدوري","body":"T = 86,164 s (بالثواني أصلًا).","guide":"القيمة معطاة بالثواني، إذن لا حاجة لأي تحويل زمني."},{"title":"نستخدم العلاقة المشتقة","body":"r = ∛[(6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 86164²) / (4π²)]","guide":"كل كمية دخلت في القانون بوحداتها الدولية، وT تربيع يعني ضرب الزمن في نفسه."},{"title":"نحسب الجذر التكعيبي","body":"r ≈ 4.222 × 10⁷ m","guide":"تذكّري أننا نأخذ الجذر التكعيبي وليس الجذر التربيعي."},{"title":"نحول إلى كيلومتر","body":"r ≈ 42,220 km","guide":"السؤال طلب نصف قطر المدار من المركز، فلا نطرح نصف قطر الأرض."}],"result":"r ≈ 4.22 × 10⁷ m ≈ 42,200 km","meaning":"الناتج مسافة مركز الأرض إلى القمر المتزامن، وليس ارتفاع القمر عن سطح الأرض.","warning":"السؤال عن نصف قطر المدار r، لذلك لا تطرحي نصف قطر الأرض. نطرحه فقط إذا طُلب الارتفاع h.","hook":"ما معنى متزامن؟ يعني أن القمر والأرض يكملان دورتيهما في زمن متطابق. السؤال يعطينا الزمن ويطلب بُعد القمر."},{"n":4,"color":"#b17a08","page":49,"id":"5","title":"استنتاج كتلة الشمس من مدار الأرض","question":"احسب كتلة الشمس إذا علمت أن نصف قطر مدار الأرض حول الشمس 1.5 × 10⁸ km، وأن الأرض تكمل مدارها في 365 يومًا، وأن كتلة الأرض تبلغ 6 × 10²⁴ kg.","given":["r = 1.5 × 10⁸ km","T = 365 يومًا","كتلة الأرض m = 6 × 10²⁴ kg"],"added":["ثابت الجذب G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"كتلة الشمس M☉ بالكيلوغرام.","why":"","principle":"","formulas":[{"formula":"GM☉m / r² = mv² / r","guide":"الشمس تجذب الأرض؛ هذه الجاذبية هي التي توفر القوة المركزية لدوران الأرض."},{"formula":"v = 2πr / T","guide":"الأرض تقطع دائرة كاملة في 365 يومًا؛ لذا نستخدم محيط الدائرة مقسومًا على الزمن."},{"formula":"M☉ = 4π²r³ / (GT²)","guide":"بعد التعويض تختفي كتلة الأرض من الطرفين ونستطيع إيجاد كتلة الشمس."}],"steps":[{"title":"تحويل البعد إلى أمتار","body":"r = 1.5 × 10⁸ × 1000 = 1.5 × 10¹¹ m","guide":"لأن قانون الجاذبية يستخدم المتر، نضرب الكيلومترات في 1000."},{"title":"تحويل الزمن إلى ثوانٍ","body":"T = 365 × 24 × 3600 = 3.1536 × 10⁷ s","guide":"كل يوم 24 ساعة، وكل ساعة 3600 ثانية؛ نضرب معًا للوصول إلى الثواني."},{"title":"كتابة التعويض","body":"M☉ = [4π² × (1.5 × 10¹¹)³] / [6.67 × 10⁻¹¹ × (3.1536 × 10⁷)²]","guide":"ننتبه إلى أن r مكعب وT مربع؛ ترتيب الأقواس مهم."},{"title":"الحساب النهائي","body":"M☉ ≈ 2.009 × 10³⁰ kg","guide":"كتلة الشمس هائلة، ولذلك يظهر الناتج بالصيغة العلمية مع الأس 30."}],"result":"كتلة الشمس ≈ 2.01 × 10³⁰ kg","meaning":"يمكن قياس كتلة جسم مركزي من حركة جسم يدور حوله مع معرفة زمن الدورة ونصف قطر المدار.","warning":"كتلة الأرض المعطاة تختصر بين طرفي معادلة القوى؛ لا تضربي بها مرة ثانية في القانون النهائي.","hook":"هل يمكن معرفة كتلة الشمس دون وزنها على ميزان؟ نعم! ننظر كيف تجذب الأرض فتجعلها تدور في مدار معلوم."},{"n":5,"color":"#a33396","page":49,"id":"6 (أ)","title":"بعد كوكب زمن دورته 8 سنوات","question":"(أ) احسب المسافة بين كوكب والشمس إذا كان زمنه الدوري المداري 8 سنوات.","given":["T = 8 سنوات"],"added":["كتلة الشمس من السؤال السابق M☉ ≈ 2.0 × 10³⁰ kg","G = 6.67 × 10⁻¹¹ N·m²/kg²","نفترض 365 يومًا في السنة"],"wanted":"المسافة r من مركز الشمس إلى الكوكب.","why":"","principle":"","formulas":[{"formula":"GM☉m / r² = mv² / r","guide":"مثل دوران القمر حول الأرض، لكن الجسم المركزي هذه المرة هو الشمس."},{"formula":"v = 2πr / T","guide":"السؤال أعطانا زمن الرحلة؛ لذلك نستبدل السرعة بمحيط الدائرة على الزمن."},{"formula":"r³ = GM☉T² / (4π²)","guide":"بعد ترتيب العلاقة نحصل على r³، ونريد r وحده."},{"formula":"r = ∛[GM☉T² / (4π²)]","guide":"نأخذ الجذر التكعيبي ونستخدم كتلة الشمس التي توصلنا إليها في السؤال 5."}],"steps":[{"title":"تحويل السنوات إلى ثوانٍ","body":"T = 8 × 365 × 24 × 3600 = 2.52288 × 10⁸ s","guide":"لا يجوز التعويض بثماني سنوات مباشرة في قانون يستخدم المتر والثانية."},{"title":"التعويض بالقيم الدولية","body":"r = ∛[(6.67 × 10⁻¹¹ × 2.0 × 10³⁰ × (2.52288 × 10⁸)²) / (4π²)]","guide":"لاحظي أن T² يعني تربيع كل القيمة المحولة إلى ثوانٍ."},{"title":"حساب المسافة بالأمتار","body":"r ≈ 5.991 × 10¹¹ m","guide":"الناتج هنا بالمتر لأن جميع المدخلات بوحدات النظام الدولي."},{"title":"التحويل إلى كيلومتر","body":"r ≈ 5.99 × 10⁸ km","guide":"نقسم على 1000 عندما نريد الإجابة بالكيلومتر."}],"result":"r ≈ 6.0 × 10⁸ km","meaning":"الكوكب أبعد عن الشمس من الأرض، ولذلك زمن دورته أكبر من سنة أرضية.","warning":"القيمة 8 سنوات يجب تحويلها إلى ثوانٍ قبل التعويض مع ثابت الجذب بوحداته الدولية.","hook":"نعرف أن الكوكب يستغرق 8 سنوات ليعود إلى النقطة نفسها، ونريد المسافة بينه وبين الشمس."},{"n":6,"color":"#a33396","page":49,"id":"6 (ب)","title":"بعد كوكب زمن دورته 45.6 سنة","question":"(ب) احسب المسافة بين أحد الكواكب والشمس إذا كان زمنه الدوري المداري 45.6 سنة.","given":["T = 45.6 سنة"],"added":["M☉ ≈ 2.0 × 10³⁰ kg (من المسألة 5)","G = 6.67 × 10⁻¹¹ N·m²/kg²","نفترض 365 يومًا في السنة"],"wanted":"المسافة r من الشمس إلى الكوكب.","why":"","principle":"","formulas":[{"formula":"GM☉m / r² = mv² / r","guide":"نبدأ بالقوة التي تحافظ على الكوكب في مداره حول الشمس."},{"formula":"v = 2πr / T","guide":"نستبدل السرعة بتعبير يعتمد على زمن الدورة ومحيط المدار."},{"formula":"r = ∛[GM☉T² / (4π²)]","guide":"هذه العلاقة تسمح بحساب r بعد تحويل الزمن إلى الثواني."}],"steps":[{"title":"تحويل الزمن","body":"T = 45.6 × 365 × 24 × 3600 = 1.4380416 × 10⁹ s","guide":"45.6 سنة عدد طويل؛ نضرب في عدد ثواني السنة للحصول على T الصحيح."},{"title":"التعويض بالقيم","body":"r = ∛[(6.67 × 10⁻¹¹ × 2.0 × 10³⁰ × (1.4380416 × 10⁹)²) / (4π²)]","guide":"لا نغيّر كتلة الشمس أو G لأن الجسم المركزي لم يتغيّر."},{"title":"الناتج بالمتر","body":"r ≈ 1.912 × 10¹² m","guide":"الجذر التكعيبي مطلوب لأننا استخرجنا r³ من تساوي القوتين."},{"title":"بالكيلومتر","body":"r ≈ 1.91 × 10⁹ km","guide":"تحويل المتر إلى كيلومتر لا يغيّر المسافة نفسها؛ يغيّر فقط طريقة كتابة الوحدة."}],"result":"r ≈ 1.91 × 10⁹ km","meaning":"كلما كبر نصف قطر المدار حول الشمس، ازداد الزمن اللازم لإتمام دورة.","warning":"اختلاف التقريب بين 1.91 و1.92 مليار km مقبول بحسب تقريب ثابت كتلة الشمس والنتائج الوسيطة.","hook":"لدينا الكوكب نفسه من نوع المسألة السابقة، لكن دورته أطول بكثير: 45.6 سنة. ماذا نتوقع؟ مدار أكبر."},{"n":7,"color":"#56801c","page":49,"id":"7","title":"زمن كوكب يبعد 14 ضعف بعد الأرض","question":"تبعد الأرض 1.5 × 10⁸ km عن الشمس. فإذا اكتُشف كوكب يبعد عن الشمس 14 مرة من بعد الأرض عنها، فكم سيكون الزمن الدوري المداري له؟ اعتبر الزمن الدوري المداري للأرض 365 يومًا.","given":["rₚ / rₑ = 14","Tₑ = 365 يومًا","rₑ = 1.5 × 10⁸ km"],"added":[],"wanted":"الزمن الدوري Tₚ للكوكب الجديد.","why":"","principle":"","formulas":[{"formula":"T = 2πr / v","guide":"الزمن الدوري هو طول الطريق الدائري مقسومًا على السرعة."},{"formula":"v = √(GM☉ / r)","guide":"تخبرنا علاقة نيوتن أن الكوكب الأبعد يتحرك بسرعة دائرية أقل حول الشمس نفسها."},{"formula":"vₚ / vₑ = √(rₑ / rₚ)","guide":"لأن الكوكبين يدوران حول الشمس نفسها، تختصر كتلة الشمس وثابت الجذب عند المقارنة."},{"formula":"Tₚ / Tₑ = (rₚ / rₑ) × (vₑ / vₚ)","guide":"نقارن الزمنين بدلاً من حساب كتلة الشمس والمسافات والسرعات كل مرة."}],"steps":[{"title":"مقارنة سرعتي المدارين","body":"بما أن rₚ/rₑ = 14، فإن vₑ/vₚ = √14.","guide":"عندما تتضاعف المسافة 14 مرة، تقل السرعة بنسبة الجذر التربيعي لـ 14."},{"title":"مقارنة الزمنين","body":"Tₚ/Tₑ = 14 × √14.","guide":"الزمن يزيد بسبب محيط المدار الأكبر وبسبب السرعة الأصغر."},{"title":"التعويض عن زمن الأرض","body":"Tₚ = 365 × 14 × √14 ≈ 19,119.9 يومًا","guide":"نضرب زمن الأرض 365 يومًا في عامل الزيادة الكلي."},{"title":"التحويل إلى سنوات","body":"Tₚ ≈ 19,119.9 / 365 ≈ 52.38 سنة","guide":"نقسم الأيام على 365 حتى تصبح الإجابة بعدد السنوات."}],"result":"Tₚ ≈ 52.4 سنة","meaning":"زيادة المسافة تجعل طول المدار أكبر وسرعة الحركة أبطأ، لذلك يزداد زمن الدورة كثيرًا.","warning":"لا تضربي 365 × 14 فقط؛ يلزم أيضًا أخذ انخفاض السرعة المدارية في الحسبان.","hook":"فكري في الرحلة: كوكب أبعد 14 مرة، إذن الطريق حول الشمس أطول، وسرعته المدارية أقل. العاملان يزيدان الزمن."},{"n":8,"color":"#4549a6","page":49,"id":"8 (أ)","title":"لو أصبح اليوم الأرضي 12 ساعة","question":"تدور الأقمار الاصطناعية الثابتة بالنسبة إلى الأرض على ارتفاع 36,000 km عن سطح الأرض (أي على بعد نحو 42,300 km من مركز الأرض). (أ) إذا كان طول يوم الأرض 12 ساعة فقط بدلًا من 24 ساعة، فهل يكون ارتفاع القمر الاصطناعي الثابت أعلى من 36,000 km أم أدنى منه أم يساويه؟","given":["الارتفاع الحالي ≈ 36,000 km","T الحالي ≈ 24 h","T الجديد = 12 h"],"added":["نفترض عدم تغير كتلة الأرض ونصف قطرها."],"wanted":"هل المدار الجديد أعلى أم أدنى أم مساوٍ؟","why":"","principle":"","formulas":[{"formula":"v = 2πr / T","guide":"السرعة في دورة كاملة تعتمد على محيط المدار والزمن."},{"formula":"v = √(GM / r)","guide":"تحدد جاذبية الأرض السرعة اللازمة للمدار الدائري."},{"formula":"r = ∛[GMT² / (4π²)]","guide":"من هذين القانونين نرى أن الزمن الأقصر يحتاج نصف قطر مدار أصغر."}],"steps":[{"title":"نحدد الزمن المطلوب","body":"T الجديد = T القديم / 2.","guide":"نصف 24 ساعة هو 12 ساعة، لذلك زمن الدورة المطلوب أصبح أقصر."},{"title":"نقرأ العلاقة الفيزيائية","body":"عند ثبات M وG، تقليل T يؤدي إلى تقليل r.","guide":"لا نغيّر كتلة الأرض في هذا الافتراض؛ تقليل T يعني تقليل r."},{"title":"نحوّل ذلك إلى ارتفاع","body":"لأن h = r − R ومع ثبات R، يقل الارتفاع أيضًا.","guide":"إذا اقترب مدار القمر من مركز الأرض، فإن ارتفاعه عن سطحها يقل."}],"result":"الارتفاع الجديد أدنى من 36,000 km.","meaning":"يتحرك القمر في المدار الأقرب بسرعة أكبر ويكمل دورته بزمن أقصر.","warning":"لا نخلط بين سرعة الدوران وزيادة الارتفاع: الأقمار القريبة في مدارات دائرية تتحرك أسرع.","hook":"القمر الثابت يبدو ساكنًا فوق المكان نفسه لأن زمن دورته مثل زمن يوم الأرض. ماذا لو صار اليوم نصف طوله؟"},{"n":9,"color":"#4549a6","page":49,"id":"8 (ب)","title":"لو أصبحت كتلة الأرض مثلي كتلتها","question":"(ب) لنفترض أن الأرض قد تكونت منذ ما يقرب من خمسة مليارات سنة بكتلة تبلغ مثلي كتلتها الحالية، فهل سيكون ارتفاع القمر الاصطناعي الثابت بالنسبة إلى الأرض أعلى من 36,000 km أم أدنى منه أم يساويه؟","given":["M الجديدة = 2M القديمة","ارتفاع المدار الحالي ≈ 36,000 km"],"added":["نفترض ثبات طول اليوم الأرضي.","نفترض ثبات نصف قطر الأرض."],"wanted":"هل ارتفاع المدار المتزامن يزيد أم ينقص أم يبقى؟","why":"","principle":"","formulas":[{"formula":"r = ∛[GMT² / (4π²)]","guide":"نصف قطر المدار يتحدد بالجاذبية والزمن الدوري؛ والآن الزمن ثابت والكتلة تغيّرت."},{"formula":"r الجديدة / r القديمة = ∛(M الجديدة / M القديمة)","guide":"نقارن قبل وبعد بدل إعادة الحساب بكل الأرقام."}],"steps":[{"title":"نكتب الكتلة الجديدة","body":"M الجديدة = 2M القديمة.","guide":"هذا هو الفرق الوحيد المقصود في المسألة: تصبح كتلة الأرض ضعف قيمتها."},{"title":"نقسم علاقتي نصف القطر","body":"عند ثبات G وT: r الجديدة / r القديمة = ∛2.","guide":"عند القسمة تختصر الثوابت والزمن ونبقي نسبة الكتلتين."},{"title":"نحسب النسبة","body":"∛2 ≈ 1.26، أي إن نصف قطر المدار أكبر بنحو 26%.","guide":"الجذر التكعيبي لـ2 نحو 1.26، أي إن المدار الجديد أبعد."},{"title":"نستنتج الارتفاع","body":"مع ثبات نصف قطر الأرض R يزداد h = r − R.","guide":"كلما كبر نصف قطر المدار مع ثبات حجم الأرض زاد ارتفاع القمر."}],"result":"الارتفاع الجديد أعلى من 36,000 km.","meaning":"عند ثبات الزمن الدوري، تتطلب الكتلة المركزية الأكبر مدارًا أبعد.","warning":"النتيجة تعتمد على افتراضي ثبات يوم الأرض ونصف قطرها. لو تغير طول اليوم أيضًا فقد يختلف الحكم.","hook":"تخيّلي أرضًا أثقل بمرتين. لكي يكون القمر ثابتًا بالنسبة لها وبنفس طول اليوم، في أي مسافة ينبغي أن يدور؟"},{"n":10,"color":"#b95c1b","page":56,"id":"34 (أ)","title":"GPS: إيجاد المسافة من زمن الإشارة","question":"يرسل القمر الاصطناعي العالمي لتحديد المواقع (GPS) إشارة لاسلكية يستقبلها جهاز استقبال على الأرض بعد 67 ms من إرسالها. (أ) احسب ارتفاع القمر الاصطناعي عن سطح الأرض.","given":["زمن انتقال الإشارة t = 67 ms"],"added":["سرعة الضوء c = 3.0 × 10⁸ m/s","نفترض أن القمر يقع فوق جهاز الاستقبال مباشرة.","نهمل التأخيرات الإضافية لمسار الإشارة."],"wanted":"ارتفاع القمر h في النموذج المفترض.","why":"","principle":"","formulas":[{"formula":"d = v × t","guide":"أي مسافة تقطعها حركة منتظمة = السرعة × الزمن."},{"formula":"في الإشارة اللاسلكية: v = c","guide":"الإشارة موجة كهرومغناطيسية؛ سرعتها تقارب سرعة الضوء c."},{"formula":"d = c × t","guide":"نعوّض سرعة الضوء بدل السرعة المعتادة، ثم نحسب المسافة."}],"steps":[{"title":"نحوّل الميلي ثانية إلى ثانية","body":"t = 67 × 10⁻³ = 0.067 s","guide":"الميلي ثانية جزء من الألف من الثانية. لذلك 67 ms = 0.067 s."},{"title":"نطبق قانون المسافة","body":"d = (3.0 × 10⁸) × 0.067 = 2.01 × 10⁷ m","guide":"السرعة متر لكل ثانية، والوقت بالثواني؛ إذن الوحدة النهائية متر."},{"title":"نحول إلى كيلومتر","body":"d = 2.01 × 10⁷ / 1000 = 20,100 km","guide":"نقسم على 1000 حتى نعبر عن المسافة بالكيلومترات."},{"title":"نفسر في ضوء الافتراض","body":"إذا كان القمر مباشرة فوق المستقبل فالمسافة المستقيمة للإشارة مساوية للارتفاع h.","guide":"تنبيه: اعتبرنا هذه المسافة ارتفاعًا لأننا افترضنا القمر فوق الجهاز مباشرة."}],"result":"d = 20,100 km؛ وبافتراض المسار الرأسي h = 20,100 km.","meaning":"هذه مسافة انتقال الإشارة، وليس مقدار السرعة المدارية للقمر.","warning":"زمن الإشارة وحده لا يحدد ارتفاع القمر الهندسي إذا كانت الإشارة تسير بزاوية. لذلك تظهر فرضية المسار الرأسي صراحة.","hook":"هنا يوجد نوعان من الحركة: حركة القمر في المدار، وحركة الإشارة من القمر إلى الجهاز. نحتاج مسافة الإشارة أولًا."},{"n":11,"color":"#b95c1b","page":56,"id":"34 (ب)","title":"GPS: شدة مجال الجاذبية عند الارتفاع","question":"(ب) احسب شدة مجال الجاذبية الأرضية عند ذلك الارتفاع، علمًا بأن كتلة الأرض 6.0 × 10²⁴ kg ونصف قطر الأرض 6.4 × 10⁶ m.","given":["Mₑ = 6.0 × 10²⁴ kg","Rₑ = 6.4 × 10⁶ m","من (أ): h = 2.01 × 10⁷ m (وفق الافتراض)"],"added":["G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"شدة مجال الجاذبية g عند القمر.","why":"","principle":"","formulas":[{"formula":"g = F_g / m","guide":"المجال هو قوة الجاذبية التي تؤثر في كل كيلوغرام واحد."},{"formula":"F_g = GMₑm / r²","guide":"نستبدل القوة بقانون الجذب العام."},{"formula":"g = GMₑ / r²","guide":"تختصر كتلة القمر الصغيرة، فنرى أن المجال يعتمد على كتلة الأرض وبعد القمر فقط."}],"steps":[{"title":"نحسب نصف قطر المدار","body":"r = Rₑ + h = 6.4 × 10⁶ + 2.01 × 10⁷ = 2.65 × 10⁷ m","guide":"هذا هو بُعد القمر عن مركز الأرض، وليس ارتفاعه عن السطح."},{"title":"نكتب التعويض الصحيح","body":"g = (6.67 × 10⁻¹¹ × 6.0 × 10²⁴) / (2.65 × 10⁷)²","guide":"في المقام r²؛ أي إننا نضرب نصف قطر المدار في نفسه."},{"title":"نحسب شدة المجال","body":"g ≈ 0.5699 N/kg ≈ 0.570 N/kg","guide":"القيمة صغيرة مقارنة بجاذبية السطح لكنها ليست صفرًا."}],"result":"g ≈ 0.570 N/kg","meaning":"مجال الجاذبية يقل مع زيادة البعد عن مركز الأرض، لكنه لا يختفي عند هذا الارتفاع.","warning":"نتيجة (ب) مشروطة بارتفاع الجزء (أ). ولا نضع الارتفاع h مباشرة بدل نصف قطر المدار r في المقام.","hook":"الجاذبية تقل كلما ابتعدنا عن مركز الأرض. نحتاج أولًا المسافة من المركز إلى قمر GPS، ثم نعوض."},{"n":12,"color":"#b95c1b","page":56,"id":"34 (ج)","title":"GPS: السرعة المدارية للقمر","question":"(ج) كم تبلغ السرعة المدارية للقمر الاصطناعي؟","given":["Mₑ = 6.0 × 10²⁴ kg","r = 2.65 × 10⁷ m من الجزأين السابقين"],"added":["G = 6.67 × 10⁻¹¹ N·m²/kg²"],"wanted":"سرعة القمر في مداره v.","why":"","principle":"","formulas":[{"formula":"GMm/r² = mv²/r","guide":"قوة الجاذبية هي القوة المركزية للقمر الصناعي."},{"formula":"v² = GM / r","guide":"نختصر كتلة القمر ونرتب حتى تصبح السرعة وحدها."},{"formula":"v = √(GM / r)","guide":"نأخذ الجذر التربيعي لإيجاد مقدار السرعة."}],"steps":[{"title":"نأخذ نصف قطر المدار","body":"r = 2.65 × 10⁷ m","guide":"نستخدم r المحسوب سابقًا من مركز الأرض."},{"title":"نعوض في قانون السرعة المدارية","body":"v = √[(6.67 × 10⁻¹¹ × 6.0 × 10²⁴) / (2.65 × 10⁷)]","guide":"نقسم GM على r داخل الجذر ثم نحسب الجذر."},{"title":"نحسب الناتج","body":"v ≈ 3886 m/s","guide":"الناتج بوحدة m/s لأنه مشتق من وحدات SI."},{"title":"نحوّل إلى km/s","body":"v ≈ 3.89 km/s","guide":"نقسم على 1000 حتى نكتب القيمة بالكيلومتر في الثانية."}],"result":"v ≈ 3.89 km/s","meaning":"سرعة حركة القمر مختلفة تمامًا عن سرعة انتشار موجة GPS التي تقارب سرعة الضوء.","warning":"لا تستخدمي c = 3 × 10⁸ m/s بوصفها سرعة القمر المدارية؛ هي سرعة الإشارة فقط.","hook":"هنا لا نحسب سرعة الضوء! المطلوب سرعة حركة قمر GPS حول الأرض، وهي أصغر بكثير."},{"n":13,"color":"#097e90","page":57,"id":"35 (أ)","title":"مقارنة جاذبية محطة الفضاء بالجاذبية السطحية","question":"يُجري رواد الفضاء تجارب في بيئة الجاذبية الصغرى على متن محطة الفضاء الدولية التي تدور على ارتفاع 416 km عن سطح الأرض. (أ) كم تبلغ النسبة بين شدة الجاذبية الأرضية على هذا الارتفاع وشدتها على سطح الأرض؟","given":["ارتفاع محطة الفضاء h = 416 km"],"added":["نصف قطر الأرض Rₑ = 6.4 × 10⁶ m"],"wanted":"النسبة g_h / g_0.","why":"","principle":"","formulas":[{"formula":"على السطح: g_0 = GM / R²","guide":"عند سطح الأرض، البعد من المركز يساوي نصف قطر الأرض."},{"formula":"عند المحطة: g_h = GM / (R + h)²","guide":"عند المحطة، البعد من المركز أكبر ويساوي R+h."},{"formula":"g_h / g_0 = [R / (R + h)]²","guide":"نقسم قيمة المجال هناك على المجال هنا؛ فتختصر كتلة الأرض وثابت الجذب."}],"steps":[{"title":"نحوّل الارتفاع إلى متر","body":"h = 416 × 1000 = 416,000 m","guide":"الارتفاع بالكيلومتر؛ نحوله إلى المتر ليطابق نصف قطر الأرض."},{"title":"نكتب نسبة المجالين","body":"g_h / g_0 = [6.4 × 10⁶ / (6.4 × 10⁶ + 416,000)]²","guide":"نضيف R وh داخل المقام قبل تربيع النسبة."},{"title":"نحسب النسبة","body":"g_h / g_0 ≈ 0.88166","guide":"النسبة 0.88 تعني أن الجاذبية أقل قليلًا من قيمتها السطحية."},{"title":"نحول إلى نسبة مئوية","body":"0.88166 × 100 ≈ 88.2%","guide":"عند ضرب كسر عشري في 100 نحصل على النسبة المئوية."}],"result":"الجاذبية عند المحطة ≈ 88.2% من الجاذبية السطحية.","meaning":"الجاذبية لا تزال قوية جدًا عند محطة الفضاء؛ الجاذبية الصغرى لا تعني انعدام قوة جذب الأرض.","warning":"لا تنسي تربيع الكسر كله، ولا تفترضي أن الجاذبية تساوي صفرًا بمجرد الابتعاد عن سطح الأرض.","hook":"رواد الفضاء قريبون نسبيًا من الأرض. سنقارن الجاذبية هناك بالجاذبية التي نعرفها على السطح."},{"n":14,"color":"#097e90","page":57,"id":"35 (ب)","title":"لماذا يشعر رواد الفضاء بانعدام الوزن؟","question":"(ب) اشرح كيف يمكن أن يكون رواد الفضاء «عديمي الوزن» فعليًا، رغم تأثرهم بجاذبية مساوية تقريبًا لتلك الموجودة على سطح الأرض.","given":["الجاذبية عند المحطة ≈ 88.2% من قيمتها على السطح.","المحطة تدور حول الأرض."],"added":[],"wanted":"تفسير انعدام الوزن الظاهري رغم وجود الجاذبية.","why":"","principle":"","formulas":[{"formula":"F_g = F_c","guide":"الأرض تجذب المحطة وروادها نحو المركز."},{"formula":"GMm/r² = mv²/r","guide":"الجاذبية تفسر تغير اتجاه الحركة المدارية."},{"formula":"في السقوط الحر: قوة الإسناد ≈ 0","guide":"قوة إسناد الأرضية تصبح شبه معدومة في السقوط الحر، لذا يشعر الرواد بانعدام الوزن."}],"steps":[{"title":"نفهم ما يحدث للمحطة","body":"الأرض تجذب المحطة وتجعلها تتسارع نحو مركزها باستمرار.","guide":"المحطة تتحرك أفقياً بسرعة كبيرة بينما تجذبها الأرض للداخل."},{"title":"نفهم ما يحدث للرواد","body":"الرواد يسقطون مع المحطة في المدار نفسه تقريبًا، ولذلك لا يضغطون على أرضيتها كما على سطح الأرض.","guide":"الرواد والمحطة يسقطون معًا، لذلك لا تضغط أقدامهم على أرضية المحطة كما نفعل على الأرض."},{"title":"نفسر الإحساس بانعدام الوزن","body":"عندما تقترب قوة الإسناد من الصفر، يصبح الوزن الظاهري قريبًا من الصفر مع بقاء الجاذبية.","guide":"ما انعدم تقريبًا هو الضغط أو الإسناد، وليس جذب الأرض."}],"result":"انعدام الوزن الظاهري سببه السقوط الحر المداري المستمر، وليس انعدام الجاذبية.","meaning":"المحطة والرواد يسقطون حول الأرض معًا، ولا تصطدم المحطة بالأرض لأن لديها سرعة أفقية مناسبة.","warning":"القول إن رواد الفضاء بلا جاذبية قول غير صحيح. ما ينعدم تقريبًا هو إحساس الإسناد (الوزن الظاهري).","hook":"قد يبدو الرواد وكأنهم يطفون بلا جاذبية، لكن الجاذبية هي نفسها التي تبقي محطتهم تدور!"},{"n":15,"color":"#665199","page":57,"id":"36","title":"الزمن الدوري لجسيم في حلقة زحل الخارجية","question":"لكوكب زحل العديد من الحلقات التي تحيط به، وهي تتكون من جسيمات صغيرة تدور حوله. فإذا كانت كتلة زحل تبلغ 5.69 × 10²⁶ kg والقطر الخارجي لإحدى الحلقات 2.72 × 10⁸ m، فكم يبلغ الزمن الدوري المداري لجسيم على الحافة الخارجية للحلقة كي يكمل مداره عليها؟","given":["كتلة زحل M = 5.69 × 10²⁶ kg","قطر الحلقة الخارجي D = 2.72 × 10⁸ m"],"added":["G = 6.67 × 10⁻¹¹ N·m²/kg²","نفترض مدارًا دائريًا لجسيم الحلقة."],"wanted":"الزمن الدوري المداري T.","why":"","principle":"","formulas":[{"formula":"r = D / 2","guide":"نصف القطر يساوي نصف القطر الكامل المعطى، لأن السؤال أعطى قطر الحلقة."},{"formula":"v = √(GM / r)","guide":"السرعة المدارية تُستنتج من تساوي جاذبية زحل والقوة المركزية."},{"formula":"T = 2πr / v","guide":"الجسيم يقطع محيط الدائرة في كل دورة."},{"formula":"T = 2π√[r³ / (GM)]","guide":"نعوض عن السرعة ثم نبسط لنحصل على الزمن باستخدام M وr فقط."}],"steps":[{"title":"نحسب نصف قطر مدار الجسيم","body":"r = 2.72 × 10⁸ / 2 = 1.36 × 10⁸ m","guide":"القطر يمتد من طرف الحلقة إلى الطرف المقابل، ونصفه هو r."},{"title":"نعوض في قانون الزمن الدوري","body":"T = 2π√[(1.36 × 10⁸)³ / (6.67 × 10⁻¹¹ × 5.69 × 10²⁶)]","guide":"أبقي القوس الذي يحتوي r³ كاملًا داخل الجذر."},{"title":"نحسب الزمن بالثواني","body":"T ≈ 51,153 s","guide":"الزمن بالثواني لأننا استخدمنا الوحدات الدولية."},{"title":"نحول إلى ساعات","body":"T = 51,153 / 3600 ≈ 14.21 h","guide":"كل ساعة 3600 ثانية، فنقسم الناتج حتى نحصل على عدد الساعات."}],"result":"T ≈ 14.2 ساعة","meaning":"جسيم عند الحافة الخارجية للحلقة يحتاج قرابة 14 ساعة و12 دقيقة لإكمال دورة حول زحل.","warning":"المعطى هو القطر D، والقانون يستخدم نصف القطر r = D/2؛ استخدام القطر سيعطي قيمة خاطئة جدًا.","hook":"زحل محاط بحلقات من جسيمات صغيرة. لنعرف مدة دورة جسيم واحد نحتاج طول المدار وسرعته."}];
const LAWS=/*LAW_DATA*/[{"id":"gravity","title":"قانون نيوتن للجذب العام","sub":"لماذا تجذب الأرض القمر، وتستطيع الشمس جذب الكواكب؟","intro":"تخيّلي جسمين لهما كتلة. كل جسم يجذب الآخر. الأجسام الضخمة مثل الأرض والشمس تصنع قوة جذب كبيرة، وتقل هذه القوة إذا أبعدنا الجسم الصغير عنها.","steps":[["الفكرة بالكلمات","قوة الجاذبية تتناسب طرديًا مع حاصل ضرب الكتلتين، وعكسيًا مع مربع المسافة بين مركزيهما.","F_g = GMm / r²"],["معنى الرموز","M كتلة الأرض أو الشمس، وm كتلة القمر أو الكوكب، وr المسافة من المركز إلى المركز، وG ثابت الجذب العام.","G = 6.67 × 10⁻¹¹ N·m²/kg²"],["ماذا يحدث عندما يزيد البعد؟","إذا ضاعفتِ البعد r مرتين، يصبح مربع البعد أربعة أمثال، فتضعف قوة الجذب إلى الربع.","F_g الجديد = F_g القديم / 4"]],"use":"نستخدم هذا القانون عند دراسة قوة الجذب والأقمار والكواكب، وهو بداية اشتقاق علاقات الحركة المدارية.","alert":"r هي المسافة بين المركزين، وليست الارتفاع فوق السطح."},{"id":"centripetal","title":"القوة المركزية والحركة الدائرية","sub":"كيف يستمر الجسم في الحركة حول المركز بدل أن يتحرك بخط مستقيم؟","intro":"حتى إذا ظل مقدار سرعة القمر ثابتًا، فإن اتجاه السرعة يتغير طوال دورانه. يحتاج هذا التغير إلى قوة تتجه نحو المركز.","steps":[["نفهم الاتجاه","السرعة المماسية تتجه على امتداد المسار، أما القوة المركزية فتتجه إلى داخل الدائرة."],["نكتب مقدار القوة المركزية","تزداد هذه القوة بزيادة الكتلة أو مربع السرعة، وتقل عند زيادة نصف قطر المسار.","F_c = mv² / r"],["من يوفر القوة في مدار القمر؟","جاذبية الأرض هي القوة المركزية نفسها؛ لا نضيف قوة جديدة فوق الجاذبية.","F_g = F_c"]],"use":"مفتاح فهم كل المسائل المدارية واشتقاق السرعة والزمن الدوري.","alert":"القوة المركزية اسم لدور القوة واتجاهها، وليست قوة مستقلة تضاف إلى قوة الجاذبية."},{"id":"speed","title":"اشتقاق السرعة المدارية","sub":"لماذا تكون سرعة القمر الدائري أقرب إلى الأرض أكبر؟","intro":"نريد معرفة مقدار السرعة v لجسم يدور في مدار دائري حول كتلة كبيرة M. نبدأ بقوة الجاذبية التي تؤدي وظيفة القوة المركزية.","steps":[["القانون الأول","قوة الجاذبية بين الجسمين.","F_g = GMm / r²"],["القانون الثاني","مقدار القوة المركزية المطلوبة للحركة الدائرية.","F_c = mv² / r"],["نساوي القوتين","لأن الجاذبية نفسها هي القوة التي تجعل القمر يدور.","GMm / r² = mv² / r"],["نختصر كتلة القمر","توجد m في طرفي المعادلة، فتختصر، ثم نضرب في r.","v² = GM / r"],["نأخذ الجذر التربيعي","لإيجاد v بدل v².","v = √(GM / r)"]],"use":"عندما يُطلب حساب سرعة قمر اصطناعي أو جسيم في حلقة زحل، ونستخدم r من مركز الجسم المركزي.","alert":"هذا الاشتقاق للمدار الدائري، ولا نخلط بين v المدارية وسرعة الإشارة الكهرومغناطيسية."},{"id":"period","title":"الزمن الدوري من المسافة والسرعة","sub":"كيف نحسب المدة التي يستغرقها القمر لإكمال دورة؟","intro":"تخيّلي عدّاءً يقطع مسارًا دائريًا. لمعرفة زمن دورة كاملة نعرف طول الطريق، ثم نقسمه على السرعة.","steps":[["القانون الذي نعرفه","الزمن = المسافة ÷ السرعة.","t = d / v"],["نحدد المسافة الصحيحة","المسافة في دورة دائرية واحدة هي محيط الدائرة.","d = 2πr"],["نعوض في قانون الزمن","نسمي زمن الدورة الكاملة T.","T = 2πr / v"],["نفهم الوحدات","إذا كان r بالمتر وv بالمتر لكل ثانية، فإن الناتج بالثواني.","s = m / (m/s)"]],"use":"في حساب الزمن الدوري للأقمار الاصطناعية، ويمكن الجمع مع قانون السرعة المدارية إذا لم تكن السرعة معطاة.","alert":"الارتفاع h ليس المسافة التي يقطعها القمر في دورة؛ استخدمي محيط المدار."},{"id":"radius","title":"اشتقاق نصف قطر المدار من الزمن الدوري","sub":"إذا عرفنا زمن الدورة فقط، فكيف نجد بعد القمر عن المركز؟","intro":"نجمع قانونًا من الجاذبية وقانونًا من الحركة المنتظمة، ثم نستبدل السرعة حتى يصبح المجهول الوحيد هو r.","steps":[["نساوي الجاذبية بالقوة المركزية","ونختصر كتلة القمر الصغيرة.","v² = GM / r"],["نعبّر عن السرعة بالزمن","محيط المدار على الزمن الدوري.","v = 2πr / T"],["نعوض عن v","نضع التعبير الثاني مكان v في المعادلة الأولى.","(2πr / T)² = GM / r"],["نرتب الخطوات","نربع الطرف الأيسر ثم نضرب في r وT².","4π²r³ = GMT²"],["نستخرج r³","نقسم على 4π².","r³ = GMT² / (4π²)"],["نأخذ الجذر التكعيبي","لأننا نريد r وليس r³.","r = ∛[GMT² / (4π²)]"]],"use":"في حساب نصف قطر المدار المتزامن، أو بعد كوكب عن الشمس عند معرفة زمن دورته.","alert":"هذا اشتقاق مباشر من قوانين نيوتن والحركة الدائرية. الزمن يجب أن يكون بالثواني عند استخدام وحدات SI."},{"id":"centralmass","title":"اشتقاق كتلة الشمس من حركة الأرض","sub":"كيف نعرف كتلة الشمس دون وضعها على ميزان؟","intro":"الأرض تدور لأن الشمس تجذبها. يمكن استنتاج كتلة الشمس إذا عرفنا نصف قطر مدار الأرض والزمن الذي تستغرقه لإكمال دورة.","steps":[["قوة جذب الشمس = القوة المركزية","كتلة الشمس M وكتلة الأرض الصغيرة m.","GMm / r² = mv² / r"],["نختصر m","كتلة الأرض تختفي من طرفي المعادلة.","GM = v²r"],["نعوض السرعة من زمن الدورة","نستخدم v = 2πr / T.","GM = 4π²r³ / T²"],["نقسم على G","فنصل إلى كتلة الجسم المركزي.","M = 4π²r³ / (GT²)"]],"use":"لحساب كتلة الشمس أو كتلة أي جسم مركزي من حركة قمر أو كوكب حوله.","alert":"كتلة الأرض قد تظهر في المعطيات لكنها تختصر في الاشتقاق؛ لا نستخدمها في القانون النهائي."},{"id":"gravityfield","title":"شدة مجال الجاذبية ومقارنتها","sub":"لماذا تضعف الجاذبية كلما ارتفعنا فوق سطح الأرض؟","intro":"المجال يخبرنا مقدار قوة الجذب المؤثرة في كل كيلوغرام من الكتلة عند مكان معين.","steps":[["تعريف شدة المجال","قوة الجاذبية مقسومة على كتلة الجسم الذي نختبر به المجال.","g = F_g / m"],["نعوض بقانون الجذب العام","نضع GMm/r² بدل F_g.","g = (GMm / r²) / m"],["نختصر m","فينتج قانون مجال الجاذبية عند البعد r.","g = GM / r²"],["عند سطح الأرض","المسافة من المركز إلى السطح هي R.","g_0 = GM / R²"],["عند ارتفاع h","المسافة من المركز هي R+h.","g_h = GM / (R + h)²"],["نقارن النسبتين","نقسم علاقة الارتفاع على علاقة السطح وتختصر G وM.","g_h / g_0 = [R / (R + h)]²"]],"use":"لحساب g عند ارتفاع قمر GPS، أو مقارنة جاذبية محطة الفضاء بقيمة الجاذبية على السطح.","alert":"وجود جاذبية أقل لا يعني انعدام الجاذبية؛ إن وحدة g هي N/kg وتكافئ m/s²."},{"id":"radiusalt","title":"نصف قطر المدار والارتفاع والقطر","sub":"ثلاث كلمات متشابهة، ولكنها تعني مسافات مختلفة.","intro":"نصف القطر المداري يُقاس من مركز الأرض، بينما ارتفاع القمر يُقاس بدءًا من سطحها، والقطر يبلغ ضعفي نصف القطر.","steps":[["من السطح إلى المدار","نضيف ارتفاع القمر إلى نصف قطر الأرض.","r = R + h"],["من المدار إلى الارتفاع","إذا عرفنا r ونريد h، نطرح نصف قطر الأرض.","h = r − R"],["القطر في حلقات زحل","إذا أُعطينا قطر مدار دائري، نقسمه على 2.","r = D / 2"]],"use":"تقريبًا في كل المسائل العددية؛ خصوصًا مسائل 3 و34 و36.","alert":"الخلط بين r وh هو أحد أكثر أسباب الإجابات الخاطئة."},{"id":"sync","title":"القمر المتزامن مع دوران الأرض","sub":"كيف يبدو القمر ثابتًا فوق مكان معيّن؟","intro":"لكي يدور القمر بنفس وتيرة دوران الأرض، يجب أن يساوي زمنه الدوري زمن دوران الأرض حول محورها بالنسبة للنجوم.","steps":[["شرط الزمن","الزمن الدوري للقمر المتزامن يساوي زمن دوران الأرض المعطى.","T القمر = T الأرض"],["نستخدم قانون المدار المستنتج","نصف قطر المدار يعتمد على M وT.","r = ∛[GMT²/(4π²)]"],["إذا قلّ طول اليوم","عند ثبات كتلة الأرض، يقل r أيضًا."],["إذا زادت كتلة الأرض","عند ثبات T، يزيد r."],["لثبات القمر في السماء فوق نقطة واحدة","يلزم أيضًا مدار دائري استوائي باتجاه دوران الأرض."]],"use":"السؤال 4 عن المدار المتزامن والسؤال 8 عن تغير طول اليوم أو كتلة الأرض.","alert":"زمن 86,164 ثانية هو اليوم النجمي تقريبًا، أما اليوم الشمسي المعتاد فيقارب 24 ساعة."},{"id":"signals","title":"GPS: مسافة الإشارة مقابل سرعة المدار","sub":"لماذا نستخدم سرعة الضوء في جزء، وقانون الجاذبية في جزء آخر؟","intro":"عند استقبال جهاز أرضي إشارة GPS تحدث حركتان مختلفتان: القمر يدور حول الأرض، والإشارة تنتقل من القمر إلى الجهاز.","steps":[["مسافة الإشارة اللاسلكية","المسافة = سرعة انتشار الموجة × زمن رحلتها.","d = c × t"],["ما سرعة c؟","سرعة الضوء التقريبية في الفراغ.","c = 3 × 10⁸ m/s"],["ما سرعة القمر حول الأرض؟","نستخدم قانون السرعة المدارية بدلًا من سرعة الإشارة.","v = √(GM / r)"],["متى تكون مسافة الإشارة ارتفاعًا؟","فقط في الفرض المبسط إذا كان القمر فوق المستقبل مباشرة، مع إهمال التأخيرات الإضافية."]],"use":"المسألة 34 بأجزائها (أ) و(ب) و(ج).","alert":"إذا كان القمر مائلًا عن المستقبل فإن مسافة الإشارة خط مائل، ولا يمكن اعتبارها ارتفاعًا دون معلومة هندسية إضافية."},{"id":"freefall","title":"انعدام الوزن الظاهري والسقوط الحر","sub":"هل انعدمت جاذبية الأرض عند رواد محطة الفضاء؟","intro":"محطة الفضاء والرواد يتأثرون بجاذبية قوية، لكنهم في حالة سقوط حر حول الأرض، ولذلك يبدو الرواد وكأنهم يطفون.","steps":[["الجاذبية لم تختف","الأرض تجذب المحطة والرواد إلى مركزها.","F_g = GMm / r²"],["كيف يواصلون الدوران؟","سرعتهم الأفقية تجعلهم يسقطون حول الأرض بدل الاصطدام بها."],["لماذا لا يشعرون بالوزن؟","لأن الرواد والمحطة يسقطون معًا، فلا تكاد توجد قوة إسناد من أرضية المحطة."],["ماذا نقصد بالوزن الظاهري؟","هو الإحساس المرتبط بقوة الإسناد. وقد يكون قريبًا من الصفر رغم وجود قوة الجاذبية."]],"use":"المسألة 35 (ب)، وفهم الجاذبية عند محطة الفضاء الدولية.","alert":"لا تقولي إن قوة الجاذبية تساوي صفرًا؛ الذي يقترب من الصفر هو الوزن الظاهري."},{"id":"compare","title":"مقارنة سرعات الكواكب وأزمنة دوراتها","sub":"كيف نقارن بين مدارين حول الشمس دون حساب جميع الثوابت؟","intro":"إذا دار كوكبان حول الشمس نفسها، يبقى G وكتلة الشمس ثابتين. لذلك نستطيع مقارنة السرعات والأزمنة باستعمال النسب.","steps":[["نبدأ من قانون السرعة المدارية","المسافة الأكبر تعني سرعة دائرية أقل حول الجسم المركزي نفسه.","v = √(GM / r)"],["نقسم السرعتين","تختصر G وM في النسبة.","v_p / v_e = √(r_e / r_p)"],["نقارن الزمنين","من الزمن = المحيط على السرعة.","T_p / T_e = (r_p / r_e) × (v_e / v_p)"],["مثال النسبة 14","إذا كان المدار الجديد أبعد 14 مرة، تقل سرعته بمعامل √14 ويطول زمنه بمعامل 14√14.","T_p / T_e = 14√14"]],"use":"السؤال 7 والمقارنات بين الكواكب حول الجسم المركزي نفسه.","alert":"زيادة نصف القطر لا تعني زيادة زمن الدورة بالنسبة نفسها فقط؛ السرعة المدارية تتغير أيضًا."}];

const state={tab:"home",group:0,problem:null,problemPane:"question",step:0,law:0};
function E(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function byId(id){return document.getElementById(id);}
function list(items,cl){return '<ul class="'+(cl||"")+'">'+items.map(x=>'<li>'+E(x)+'</li>').join("")+'</ul>';}
function eq(text){return '<div class="eq" dir="ltr">'+E(text)+'</div>';}
function sectionHeader(title,meta){return '<div class="pagebar"><h1>'+E(title)+'</h1><span class="tag">'+E(meta||"")+'</span></div>';}
function scrollMain(){const targets=byId("detail")||byId("pageScroll");if(targets)targets.scrollTop=0;}
function activateTop(){document.querySelectorAll(".tab").forEach(b=>{const a=b.dataset.tab===state.tab;b.classList.toggle("active",a);b.setAttribute("aria-current",a?"page":"false");});}
function put(html){byId("app").innerHTML=html;activateTop();scrollMain();}
function openTab(tab){
if(!["home","laws","exercises","symbols","summary"].includes(tab))return;
state.tab=tab;if(tab==="exercises"){state.problem=null;state.problemPane="question";state.step=0;}
render();
}
function openGroup(i){if(i<0||i>=GROUPS.length)return;state.tab="exercises";state.group=i;state.problem=null;state.problemPane="question";render();}
function groupOf(i){return GROUPS.findIndex(g=>i>=g.start&&i<=g.end);}
function openProblem(i){if(i<0||i>=EXERCISES.length)return;state.tab="exercises";state.problem=i;state.group=groupOf(i);state.problemPane="question";state.step=0;render();}
function openPane(p){if(!["question","law","steps","result"].includes(p))return;state.problemPane=p;if(p==="steps")state.step=0;render();}
function goCalc(n){const l=EXERCISES[state.problem];if(!l)return;state.step=Math.max(0,Math.min(n,l.steps.length-1));state.problemPane="steps";render();}
function selectLaw(i){if(i<0||i>=LAWS.length)return;state.tab="laws";state.law=i;render();}
function render(){
document.documentElement.style.setProperty("--c",state.tab==="exercises"&&state.problem!==null?EXERCISES[state.problem].color:state.tab==="laws"?"#087c91":GROUPS[state.group].color);
if(state.tab==="home")renderHome();
if(state.tab==="exercises")renderExercises();
if(state.tab==="laws")renderLaws();
if(state.tab==="symbols")renderSymbols();
if(state.tab==="summary")renderSummary();
}

const cards=GROUPS.map((g,i)=>'<button class="tile" style="--c:'+g.color+'" onclick="openGroup('+i+')"><h3>مسائل صفحة '+g.page+'</h3><p>'+E(g.name)+'</p><small>'+g.label+' • اضغطي لفتح قائمة المسائل</small></button>').join("");
const html='<div class="page">'+sectionHeader("الصفحة الرئيسية","دليل الطالبة • الصف الثاني عشر")+
'<div class="scrollarea" id="pageScroll"><div class="inner"><div class="hero"><div class="eyebrow">قسم الفيزياء • إعداد: حفصة طيبي</div><h2>افهمي مسائل الحركة المدارية بسهولة</h2><p>كل مسألة تظهر وحدها عند الضغط على رقمها. والقوانين والشرح والاشتقاقات موجودة في تبويب مستقل، لتراجعي الفكرة قبل الحل.</p><div class="keypoint"><strong>كيف تستخدمين الدليل؟</strong> افتحي تبويب «القوانين واشتقاقها» لفهم الفكرة، ثم انتقلي إلى «المسائل المحلولة» واختاري رقم السؤال. يظهر السؤال ثم شرحه وحله خطوة خطوة، ولا تتكدس الأسئلة في الصفحة.</div></div><div class="tiles">'+cards+'</div><div class="tiles"><button class="tile" style="--c:#087c91" onclick="openTab(\'laws\')"><h3>القوانين واشتقاقها</h3><p>من قانون نيوتن للجذب إلى السرعة المدارية والزمن الدوري، مع تفسير كل سطر.</p></button><button class="tile" style="--c:#853449" onclick="openTab(\'symbols\')"><h3>الرموز والثوابت</h3><p>كل رمز ووحدته والتحويلات الضرورية قبل التعويض.</p></button><button class="tile" style="--c:#4a7280" onclick="openTab(\'summary\')"><h3>الملخص النهائي</h3><p>القوانين والأفكار والأخطاء الشائعة في صفحة مراجعة واحدة.</p></button></div><p class="fine">المعطيات الافتراضية أو المضافة تظهر باللون الأحمر. الشرح قائم على جاذبية نيوتن والحركة الدائرية، ولا توجد مؤقتات أو أنشطة.</p></div></div></div>';
put(html);
}
function exerciseMenu(){
const g=GROUPS[state.group];
return '<aside class="catalog"><h3>صفحات الكتاب</h3>'+GROUPS.map((x,i)=>'<button class="groupbtn'+(state.group===i?" selected":"")+'" onclick="openGroup('+i+')" style="--c:'+x.color+'">صفحة '+x.page+'</button>').join("")+
'<p>اختاري رقم المسألة فقط، وستظهر وحدها في مساحة الشرح.</p>'+
EXERCISES.slice(g.start,g.end+1).map((l,i)=>'<button class="exercise-btn'+(state.problem===g.start+i?" selected":"")+'" onclick="openProblem('+(g.start+i)+')" title="'+E(l.title)+'"><span class="numdot" style="--c:'+l.color+'"></span><span>'+E(l.id)+' • '+E(l.title)+'</span></button>').join("")+'</aside>';
}
function renderExercises(){
const g=GROUPS[state.group],l=state.problem===null?null:EXERCISES[state.problem];
let content="";
if(!l){
const buttons=EXERCISES.slice(g.start,g.end+1).map((x,i)=>'<button class="tile" style="--c:'+x.color+'" onclick="openProblem('+(g.start+i)+')"><h3>السؤال '+E(x.id)+'</h3><p>'+E(x.title)+'</p><small>اضغطي لعرض هذه المسألة فقط</small></button>').join("");
content='<div class="contenttop"><h2>مسائل صفحة '+g.page+'</h2><span class="tag">'+g.label+'</span></div>'+
'<div class="detail" id="detail"><div class="detail-inner"><div class="eyebrow">الكتاب المدرسي • صفحة '+g.page+'</div><h3>'+E(g.name)+'</h3><p class="bodytext">هذه قائمة المسائل الموجودة في هذه الصفحة. اضغطي على أي مسألة لتُفتح وحدها، مع شرح القانون والحل الكامل خطوة بخطوة.</p><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">'+buttons+'</div></div></div>';
}else{
const panes=[["question","1. فهم السؤال"],["law","2. من أين جاء القانون؟"],["steps","3. الحل خطوة خطوة"],["result","4. النتيجة والتفسير"]];
content='<div class="contenttop"><h2>السؤال '+E(l.id)+' | '+E(l.title)+'</h2><button class="smallbtn" onclick="openGroup('+state.group+')">↩ قائمة صفحة '+l.page+'</button></div>'+
'<div class="strip">'+panes.map(([id,label])=>'<button class="stripbtn'+(state.problemPane===id?" selected":"")+'" onclick="openPane(\''+id+'\')">'+label+'</button>').join("")+'</div>'+
'<div class="detail" id="detail"><div class="detail-inner">'+problemBody(l)+'</div></div>'+
'<div class="bottom"><div class="actions"><button class="smallbtn" onclick="previous()">→ السابق</button><button class="smallbtn" onclick="openGroup('+state.group+')">فهرس الصفحة</button></div><span class="tag">'+(state.problemPane==="steps"?"خطوة "+(state.step+1)+" من "+l.steps.length:"صفحة "+l.page)+'</span><button class="smallbtn primary" onclick="next()">التالي ←</button></div>';
}
put('<div class="page">'+sectionHeader("المسائل المحلولة","اختاري مسألة واحدة")+'<div class="workspace">'+exerciseMenu()+'<div class="workspace-content">'+content+'</div></div></div>');
}
function problemBody(l){
const p=state.problemPane;
if(p==="question")return '<div class="sectionlabel">أولًا • نقرأ السؤال ونفهمه</div><h3>ما الذي يطلبه السؤال؟</h3><div class="quote">'+E(l.question)+'</div><div class="why"><b>بكلمات سهلة جدًا</b>'+E(l.hook)+'</div><div class="twocol"><div class="panel"><h4>المعطيات الموجودة</h4>'+list(l.given)+'</div><div class="panel"><h4>معطيات وثوابت أو افتراضات إضافية</h4>'+(l.added.length?list(l.added,"red"):'<p class="bodytext">لا توجد إضافات لهذا السؤال.</p>')+'</div></div><div class="keypoint"><strong>ما المطلوب؟</strong> '+E(l.wanted)+'</div>';
if(p==="law")return '<div class="sectionlabel">ثانيًا • نفهم القانون قبل استخدامه</div><h3>من الفكرة إلى العلاقة النهائية</h3><div class="why"><b>الفكرة الفيزيائية</b>'+E(l.hook)+'</div><div class="origin-list">'+l.formulas.map((f,i)=>'<div class="origin-row"><span class="stepnum">'+(i+1)+'</span><div><div class="sectionlabel">المرحلة '+(i+1)+'</div><p>'+E(f.guide)+'</p>'+eq(f.formula)+'</div></div>').join("")+'</div><div class="keypoint">لا نبدأ بالتعويض قبل فهم لماذا تناسب هذه العلاقة المطلوب.</div>';
if(p==="steps"){const x=l.steps[state.step],s=state.step;const val=/^[A-Za-z0-9√∛π(]/.test(x.body.trim());return '<div class="sectionlabel">ثالثًا • حسابات مبسطة دون قفز خطوات</div><div class="bigstep"><div class="counter">الخطوة '+(s+1)+' من '+l.steps.length+'</div><h3>'+E(x.title)+'</h3>'+(val?eq(x.body):'<p class="explain">'+E(x.body)+'</p>')+'<div class="why"><b>لماذا فعلنا هذه الخطوة؟</b>'+E(x.guide)+'</div></div><div class="keypoint">بعد فهم هذه الخطوة، اضغطي «التالي» للانتقال إلى الخطوة التي تليها. يمكنك العودة لتكرار الشرح.</div>';}
return '<div class="sectionlabel">أخيرًا • نقرأ النتيجة ونفهم معناها</div><h3>الإجابة النهائية</h3><div class="answer">'+E(l.result)+'</div><div class="why"><b>ماذا تعني هذه النتيجة؟</b>'+E(l.meaning)+'</div><div class="warning"><strong>انتبهي لهذا الخطأ الشائع</strong>'+E(l.warning)+'</div><div class="keypoint">يمكنك الرجوع إلى «من أين جاء القانون؟» أو «الحل خطوة خطوة» من التبويبات أعلى هذه المسألة.</div>';
}
function next(){const l=EXERCISES[state.problem];if(!l)return;if(state.problemPane==="question")return openPane("law");if(state.problemPane==="law")return openPane("steps");if(state.problemPane==="steps"){if(state.step<l.steps.length-1)return goCalc(state.step+1);return openPane("result");}if(state.problem!==null&&state.problem<EXERCISES.length-1)return openProblem(state.problem+1);openGroup(state.group);}
function previous(){const l=EXERCISES[state.problem];if(!l)return;if(state.problemPane==="result")return goCalc(l.steps.length-1);if(state.problemPane==="steps"){if(state.step>0)return goCalc(state.step-1);return openPane("law");}if(state.problemPane==="law")return openPane("question");if(state.problem>0)return openProblem(state.problem-1);openGroup(state.group);}
function renderLaws(){
const l=LAWS[state.law];
document.documentElement.style.setProperty("--c","#087c91");
const menu='<aside class="catalog"><h3>مكتبة القوانين</h3><p>اختاري قانونًا واحدًا لقراءة شرحه واشتقاقه بالتفصيل.</p>'+LAWS.map((x,i)=>'<button class="lawbtn'+(i===state.law?" selected":"")+'" onclick="selectLaw('+i+')"><span class="numdot" style="--c:#087c91"></span><span>'+E(x.title)+'</span></button>').join("")+'</aside>';
const rows=l.steps.map((x,i)=>'<div class="origin-row"><div class="stepnum">'+(i+1)+'</div><div><div class="sectionlabel">'+E(x[0])+'</div><p>'+E(x[1])+'</p>'+(x[2]?eq(x[2]):"")+'</div></div>').join("");
const right='<div class="contenttop"><h2>'+E(l.title)+'</h2><span class="tag">القانون '+(state.law+1)+' من '+LAWS.length+'</span></div><div class="detail" id="detail"><div class="detail-inner"><div class="sectionlabel">تبويب القوانين وشرحها واشتقاقها</div><h3>'+E(l.sub)+'</h3><p class="theorydesc">'+E(l.intro)+'</p><div class="sectionlabel">خطوات الاستنتاج واحدة واحدة</div><div class="origin-list">'+rows+'</div><div class="keypoint"><strong>أين نستخدم هذا القانون؟</strong> '+E(l.use)+'</div><div class="warning"><strong>تنبيه علمي</strong>'+E(l.alert)+'</div></div></div><div class="bottom"><button class="smallbtn" onclick="selectLaw(Math.max(0,state.law-1))" '+(state.law===0?"disabled":"")+'>→ القانون السابق</button><span class="tag">الفكرة ← الاستنتاج ← التطبيق</span><button class="smallbtn primary" onclick="selectLaw(Math.min(LAWS.length-1,state.law+1))" '+(state.law===LAWS.length-1?"disabled":"")+'>القانون التالي ←</button></div>';
put('<div class="page">'+sectionHeader("القوانين واشتقاقها","مفاهيم أساسية مبسطة")+'<div class="workspace">'+menu+'<section class="workspace-content">'+right+'</section></div></div>');
}
function renderSymbols(){
const rows=SYMBOLS.map(a=>'<tr><td>'+E(a[0])+'</td><td>'+E(a[1])+'</td><td>'+E(a[2])+'</td></tr>').join("");
put('<div class="page">'+sectionHeader("الرموز والثوابت","معاني الرموز والوحدات")+'<div class="scrollarea" id="pageScroll"><div class="inner"><h2 class="h2">مرجع مبسّط قبل التعويض في أي قانون</h2><p class="bodytext">كل حرف في القانون يمثل كمية فيزيائية. افهمي معناها وتأكدي من وحدتها قبل وضع الأرقام.</p><table class="table"><thead><tr><th>الرمز</th><th>ما الذي يعنيه؟</th><th>الوحدة أو القيمة</th></tr></thead><tbody>'+rows+'</tbody></table><div class="summary" style="margin-top:19px"><div class="summarybox" style="--c:#087c91"><h3>تحويل الطول</h3><p>1 km = 1000 m</p><p>التحويل من km إلى m: نضرب في 1000.</p></div><div class="summarybox" style="--c:#853449"><h3>تحويل الزمن</h3><p>1 h = 3600 s</p><p>1 يوم = 86,400 s</p><p>1 ms = 0.001 s</p><p>1 سنة = 365 يومًا في هذه المسائل.</p></div></div><div class="keypoint"><strong>قاعدة مفيدة:</strong> يجب استخدام الثواني والأمتار والكيلوغرامات مع ثابت الجذب بوحداته الدولية، والتفريق دائمًا بين نصف قطر المدار r والارتفاع h.</div></div></div></div>');
}
function renderSummary(){
const topics=[
["قبل التعويض","نحدّد ما الذي يسأله السؤال: سرعة v، زمن T، نصف قطر r، ارتفاع h، كتلة M، أو شدة مجال g."],
["الجاذبية والحركة الدائرية","نبدأ من F_g = GMm/r² وF_c = mv²/r. في المدار الدائري: F_g = F_c."],
["السرعة المدارية","v = √(GM/r). إذا قل نصف قطر المدار حول الجسم نفسه، زادت السرعة المدارية الدائرية."],
["الزمن الدوري","T = 2πr/v. المسافة في دورة كاملة هي المحيط، وليس ارتفاع القمر."],
["نصف قطر المدار من الزمن","r = ∛[GMT²/(4π²)]، مشتق من قوانين نيوتن وتعريف السرعة المدارية."],
["كتلة الجسم المركزي","M = 4π²r³/(GT²). تختصر كتلة الكوكب الصغير أثناء الاشتقاق."],
["المجال الجاذبي","g = GM/r². وعلى ارتفاع h، استخدمي r = R+h ثم احسبي g."],
["GPS","d = ct تخص مسافة الإشارة، بينما v = √(GM/r) تخص سرعة القمر. مسافة الإشارة ليست دائمًا الارتفاع."],
["محطة الفضاء","الرواد في سقوط حر مداري، لذلك يشعرون بانعدام الوزن الظاهري رغم وجود الجاذبية."],
["حلقات زحل","إذا أُعطي قطر المدار D، نستخدم r = D/2 أولًا، ثم T = 2πr/v."]
];
const cards=topics.map((x,i)=>'<div class="summarybox" style="--c:'+(i%2?"#853449":"#087c91")+'"><h3>'+E(x[0])+'</h3><p>'+E(x[1])+'</p></div>').join("");
put('<div class="page">'+sectionHeader("ملخص المراجعة","كل الأفكار في مكان واحد")+'<div class="scrollarea" id="pageScroll"><div class="inner"><h2 class="h2">الخلاصة العلمية قبل الاختبار</h2><p class="bodytext">ارجعي إلى تبويب «القوانين واشتقاقها» إذا احتجتِ لفهم أصل أي علاقة، أو إلى «المسائل» لرؤية تطبيقها خطوة بخطوة.</p><div class="summary">'+cards+'</div></div></div></div>');
}
document.addEventListener("keydown",function(event){if(["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement?.tagName))return;if(state.tab!=="exercises"||state.problem===null)return;if(event.key==="ArrowLeft"){event.preventDefault();next();}else if(event.key==="ArrowRight"){event.preventDefault();previous();}});
openTab("home");
</script></body></html>
